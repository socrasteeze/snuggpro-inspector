<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SnuggPro Inspector</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; background: #f5f5f4; color: #1c1c1c; min-height: 100vh; }
  a { color: #1c6ef2; }

  /* Layout */
  .shell { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
  .sidebar { background: #1a1a1a; color: #d4d4d4; padding: 0; overflow-y: auto; position: sticky; top: 0; height: 100vh; }
  .main { padding: 24px; overflow-y: auto; }

  /* Sidebar */
  .sidebar-header { padding: 16px; border-bottom: 1px solid #2e2e2e; }
  .sidebar-header h1 { font-size: 14px; font-weight: 600; color: #fff; }
  .sidebar-header p { font-size: 11px; color: #888; margin-top: 2px; }
  .program-select { width: 100%; margin-top: 8px; background: #2a2a2a; color: #d4d4d4; border: 1px solid #3a3a3a; border-radius: 5px; padding: 5px 8px; font-size: 11px; cursor: pointer; }
  .program-select:focus { outline: none; border-color: #1c6ef2; }
  .sidebar-section { padding: 8px 0; border-bottom: 1px solid #2e2e2e; }
  .sidebar-section-label { font-size: 10px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.08em; padding: 6px 16px 4px; }
  .nav-item { display: block; width: 100%; text-align: left; background: none; border: none; padding: 6px 16px; font-size: 12px; color: #b0b0b0; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-item:hover { background: #2a2a2a; color: #fff; }
  .nav-item.active { background: #1c6ef2; color: #fff; }
  .nav-item .method { font-size: 9px; font-weight: 700; background: #2e2e2e; color: #888; padding: 1px 4px; border-radius: 3px; margin-right: 6px; }
  .nav-item.active .method { background: rgba(255,255,255,0.2); color: #fff; }

  /* Job ID bar */
  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px 14px; flex-wrap: wrap; }
  .topbar label { font-size: 12px; color: #666; white-space: nowrap; }
  .topbar input { border: 1px solid #e5e5e5; border-radius: 6px; padding: 6px 10px; font-size: 13px; width: 300px; }
  .topbar input:focus { outline: none; border-color: #1c6ef2; }
  .topbar .job-hint { font-size: 11px; color: #aaa; white-space: nowrap; }
  .topbar .fetch-btn { background: #1c6ef2; color: #fff; border: none; border-radius: 6px; padding: 6px 16px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .topbar .fetch-btn:hover { background: #1558c0; }
  .topbar .fetch-btn:disabled { background: #a0b8e8; cursor: default; }
  .topbar .endpoint-display { font-size: 12px; color: #888; font-family: monospace; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .status-badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
  .badge-ok { background: #e6f4ea; color: #1a7a3a; }
  .badge-err { background: #fde8e8; color: #b91c1c; }
  .badge-loading { background: #e8f0fe; color: #1c6ef2; }

  /* Result area */
  .result-wrap { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; overflow: hidden; }
  .result-toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #f0f0f0; background: #fafafa; }
  .result-toolbar h2 { font-size: 13px; font-weight: 600; flex: 1; }
  .tool-btn { font-size: 11px; padding: 4px 10px; border-radius: 5px; border: 1px solid #e5e5e5; background: #fff; cursor: pointer; color: #444; }
  .tool-btn:hover { background: #f5f5f5; }
  .tool-btn.active { background: #1c6ef2; color: #fff; border-color: #1c6ef2; }

  /* Views */
  #friendly-view { padding: 16px; }
  #raw-view { display: none; padding: 0; }
  #raw-view pre { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; line-height: 1.6; padding: 16px; white-space: pre-wrap; word-break: break-all; max-height: 70vh; overflow-y: auto; color: #1c1c1c; }

  /* Field cards */
  .field-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .field-card { background: #f8f8f8; border: 1px solid #ebebeb; border-radius: 6px; padding: 8px 10px; }
  .field-key { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }
  .field-val { font-size: 13px; font-weight: 500; word-break: break-word; }
  .field-val.null-val { color: #bbb; font-weight: 400; }
  .section-label { font-size: 11px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.06em; margin: 14px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #f0f0f0; }
  .array-item { background: #f8f8f8; border: 1px solid #ebebeb; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
  .array-item-header { font-size: 11px; color: #888; margin-bottom: 8px; }
  .empty-state { color: #aaa; font-size: 13px; text-align: center; padding: 40px; }
  .err-block { background: #fde8e8; border: 1px solid #fbc8c8; border-radius: 6px; padding: 12px 14px; color: #b91c1c; font-size: 13px; margin: 16px; }
  .divider { border: none; border-top: 1px solid #f0f0f0; margin: 14px 0; }

  /* Measures table */
  .measures-toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #f0f0f0; background: #fafafa; flex-wrap: wrap; }
  .measures-toolbar .spacer { flex: 1; }
  .measures-toolbar .summary { font-size: 12px; color: #666; }
  .csv-btn { background: #1a7a3a; color: #fff; border: none; border-radius: 5px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .csv-btn:hover { background: #156430; }
  .table-scroll { overflow-x: auto; max-height: 72vh; }
  table.measures { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.measures th, table.measures td { padding: 7px 10px; text-align: left; border-bottom: 1px solid #f0f0f0; white-space: nowrap; }
  table.measures th { background: #f5f5f4; position: sticky; top: 0; font-weight: 600; cursor: pointer; user-select: none; z-index: 1; }
  table.measures th:hover { background: #ebebea; }
  table.measures th .arrow { color: #1c6ef2; margin-left: 3px; font-size: 10px; }
  table.measures td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.measures tr:hover td { background: #f8fbff; }
  table.measures .measure-cell { font-weight: 500; }
  table.measures .src-rec { color: #1558c0; font-size: 10px; font-weight: 600; }
  table.measures .src-di { color: #8a4b00; font-size: 10px; font-weight: 600; }
  table.measures .neg { color: #b91c1c; }
  table.measures td.copyable { cursor: pointer; }
  table.measures td.copyable:hover { background: #eef4ff; outline: 1px solid #cdddf5; }
  table.measures td.copied { background: #d6f0dd !important; outline: 1px solid #8fcea4; }
  /* Calculated columns — tinted header to visually separate from Deemed group */
  table.measures th.col-calc { background: #f0f4e8; }
  table.measures th.col-calc:hover { background: #e4ebda; }
  table.measures td.col-calc { background: #f8faf3; }
  table.measures tr:hover td.col-calc { background: #edf2e0; }
  table.measures th.col-fw { background: #eef3fb; }
  table.measures th.col-fw:hover { background: #dce8f7; }
  table.measures td.col-fw { background: #f5f8fd; }
  table.measures tr:hover td.col-fw { background: #e8f0fa; }
  /* Collapsible saved/deemed columns */
  table.measures.hide-saved-deemed th.col-saved,
  table.measures.hide-saved-deemed td.col-saved,
  table.measures.hide-saved-deemed th.col-deemed,
  table.measures.hide-saved-deemed td.col-deemed { display: none; }

  /* Combined summary */
  .combined-summary { padding: 14px; border-bottom: 1px solid #f0f0f0; background: #fcfcfb; }
  .csum-basis { font-size: 12px; padding: 6px 10px; border-radius: 5px; margin-bottom: 10px; display: inline-block; }
  .csum-basis.basis-saved { background: #e6f4ea; color: #156430; }
  .csum-basis.basis-deemed { background: #e8f0fe; color: #1558c0; }
  .csum-basis.basis-warn { background: #fdecec; color: #b91c1c; }
  .csum-grid { display: flex; gap: 10px; flex-wrap: wrap; }
  .csum-card { flex: 1; min-width: 140px; background: #fff; border: 1px solid #ebebeb; border-radius: 8px; padding: 10px 14px; }
  .csum-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .csum-val { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .csum-unit { font-size: 12px; font-weight: 400; color: #999; margin-left: 4px; }
  .csum-breakdown { font-size: 11px; color: #888; margin-top: 8px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<div class="shell">

<!-- SIDEBAR -->
<nav class="sidebar">
  <div class="sidebar-header">
    <h1>SnuggPro Inspector</h1>
    <select class="program-select" id="programSelect" onchange="onProgramChange(this.value)">
      <option value="region1">Region 1 – CA LIWP Farmworkers</option>
      <option value="region2">Region 2 – CA LIWP Farmworkers</option>
      <option value="sdge">SDGE – Whole Home Program</option>
      <option value="sce" selected>SCE/SCG ESA Whole Home</option>
    </select>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-label">Reporting</div>
    <button class="nav-item active" data-path="MEASURES" data-label="Measures Table"><span class="method" style="background:#1c6ef2;color:#fff">RPT</span>Measures Table</button>
    <button class="nav-item" data-path="USAGE" data-label="Usage / Billing"><span class="method" style="background:#1c6ef2;color:#fff">RPT</span>Usage / Billing</button>
    <button class="nav-item" onclick="exportXlsx()" data-label="Export XLSX"><span class="method" style="background:#217346;color:#fff">XLS</span>Export XLSX</button>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-label">Job</div>
    <button class="nav-item" data-path="/jobs/{jobId}" data-label="Address & Metadata"><span class="method">GET</span>Address & Metadata</button>
    <button class="nav-item" data-path="/jobs/{jobId}/all-data" data-label="All Job Data"><span class="method">GET</span>All Job Data</button>
    <button class="nav-item" data-path="/jobs/{jobId}/basedata" data-label="Basedata"><span class="method">GET</span>Basedata</button>
    <button class="nav-item" data-path="/jobs/{jobId}/account" data-label="Account"><span class="method">GET</span>Account</button>
    <button class="nav-item" data-path="/jobs/{jobId}/company" data-label="Company"><span class="method">GET</span>Company</button>
    <button class="nav-item" data-path="/jobs/{jobId}/program" data-label="Program"><span class="method">GET</span>Program</button>
    <button class="nav-item" data-path="/jobs/{jobId}/job-stage-history" data-label="Stage History"><span class="method">GET</span>Stage History</button>
    <button class="nav-item" data-path="/jobs/{jobId}/alerts" data-label="Alerts"><span class="method">GET</span>Alerts</button>
    <button class="nav-item" data-path="/jobs/{jobId}/metrics-summary" data-label="Metrics Summary"><span class="method">GET</span>Metrics Summary</button>
    <button class="nav-item" data-path="/jobs/{jobId}/model" data-label="Model"><span class="method">GET</span>Model</button>
    <button class="nav-item" data-path="/jobs/{jobId}/hes-score" data-label="HES Score"><span class="method">GET</span>HES Score</button>
    <button class="nav-item" data-path="/jobs/{jobId}/utilities" data-label="Utilities"><span class="method">GET</span>Utilities</button>
    <button class="nav-item" data-path="/jobs/{jobId}/snapshots" data-label="Snapshots"><span class="method">GET</span>Snapshots</button>
    <button class="nav-item" data-path="/jobs/{jobId}/hpxml" data-label="HPXML Link"><span class="method">GET</span>HPXML Link</button>
    <button class="nav-item" data-path="/jobs/{jobId}/report" data-label="Report"><span class="method">GET</span>Report</button>
    <button class="nav-item" data-path="/jobs/{jobId}/tickets" data-label="Tickets"><span class="method">GET</span>Tickets</button>
    <button class="nav-item" data-path="/jobs/{jobId}/checklist-answers" data-label="Checklist Answers"><span class="method">GET</span>Checklist Answers</button>
    <button class="nav-item" data-path="/jobs/{jobId}/custom-lifetime-savings" data-label="Custom Lifetime Savings"><span class="method">GET</span>Custom Lifetime Savings</button>
    <button class="nav-item" data-path="/jobs/{jobId}/job-financings" data-label="Job Financings"><span class="method">GET</span>Job Financings</button>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-label">Building Systems</div>
    <button class="nav-item" data-path="/jobs/{jobId}/attics" data-label="Attics"><span class="method">GET</span>Attics</button>
    <button class="nav-item" data-path="/jobs/{jobId}/walls" data-label="Walls"><span class="method">GET</span>Walls</button>
    <button class="nav-item" data-path="/jobs/{jobId}/vaults" data-label="Vaults"><span class="method">GET</span>Vaults</button>
    <button class="nav-item" data-path="/jobs/{jobId}/windows" data-label="Windows"><span class="method">GET</span>Windows</button>
    <button class="nav-item" data-path="/jobs/{jobId}/doors" data-label="Doors"><span class="method">GET</span>Doors</button>

    <button class="nav-item" data-path="/jobs/{jobId}/dhws" data-label="Water Heaters"><span class="method">GET</span>Water Heaters</button>
    <button class="nav-item" data-path="/jobs/{jobId}/caz" data-label="CAZ"><span class="method">GET</span>CAZ</button>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-label">Appliances</div>
    <button class="nav-item" data-path="/jobs/{jobId}/refrigerators" data-label="Refrigerators"><span class="method">GET</span>Refrigerators</button>

    <button class="nav-item" data-path="/jobs/{jobId}/rebates-incentives" data-label="Rebates & Incentives"><span class="method">GET</span>Rebates & Incentives</button>
    <button class="nav-item" data-path="/jobs/{jobId}/direct-installs" data-label="Direct Installs"><span class="method">GET</span>Direct Installs</button>
    <button class="nav-item" data-path="/jobs/{jobId}/work-orders" data-label="Work Orders"><span class="method">GET</span>Work Orders</button>
    <button class="nav-item" data-path="/jobs/{jobId}/health" data-label="Health Measures"><span class="method">GET</span>Health Measures</button>
    <button class="nav-item" data-path="/jobs/{jobId}/concerns" data-label="Concerns"><span class="method">GET</span>Concerns</button>

  <div class="sidebar-section">
    <div class="sidebar-section-label">Account / Company</div>
    <button class="nav-item" data-path="/jobs" data-label="All Jobs"><span class="method">GET</span>All Jobs</button>
    <button class="nav-item" data-path="/companies" data-label="Companies"><span class="method">GET</span>Companies</button>
    <button class="nav-item" data-path="/snugg-programs" data-label="Programs"><span class="method">GET</span>Programs</button>
    <button class="nav-item" data-path="/accounts" data-label="Accounts"><span class="method">GET</span>Accounts</button>
  </div>

<!-- MAIN -->
<main class="main">
  <div class="topbar">
    <label>Job ID(s) or name</label>
    <input type="text" id="jobId" value="" placeholder="e.g. 123456, Jane Doe" />
    <span class="job-hint">IDs: comma/space separated · names: comma separated</span>
    <button class="fetch-btn" id="fetchBtn" onclick="doFetch()">Fetch</button>
    <span class="endpoint-display" id="endpointDisplay">MEASURES</span>
    <span class="status-badge" id="statusBadge" style="display:none"></span>
  </div>

  <div class="result-wrap" id="resultWrap" style="display:none">
    <div class="result-toolbar">
      <h2 id="resultTitle"></h2>
      <button class="tool-btn active" id="btnFriendly" onclick="setView('friendly')">Fields</button>
      <button class="tool-btn" id="btnRaw" onclick="setView('raw')">Raw JSON</button>
      <button class="tool-btn" id="btnCopy" onclick="copyJson()">Copy</button>
    </div>
    <div id="friendly-view"></div>
    <div id="raw-view"><pre id="rawPre"></pre></div>
  </div>
</main>

</div>
<script>
let currentPath = 'MEASURES';
let lastData = null;
let currentView = 'friendly';
// Must stay in sync with the `selected` option in #programSelect above, and with
// DEFAULT_PROGRAM in proxy.js / worker.js (which sign requests that arrive without
// a ?program=). A mismatch signs against one program while the UI claims another.
let selectedProgram = 'sce';

function onProgramChange(val) {
  selectedProgram = val;
  // Cache keys are already program-scoped, so this is housekeeping rather than
  // correctness: switching programs is the natural point to release the payloads
  // of jobs you've moved on from.
  jobDataCache.clear();
  jobListCache.clear();
}

// Relative URLs — no port detection needed; worker serves everything on same origin.
function proxyUrl(apiPath) {
  return `/proxy${apiPath}?program=${selectedProgram}`;
}

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    // Action buttons (Export XLSX) carry no data-path — they run their own onclick.
    // Without this guard they'd blank currentPath, steal the active highlight from
    // the current view, and throw in resolvedPath() on the follow-up doFetch().
    if (!btn.dataset.path) return;
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPath = btn.dataset.path;
    document.getElementById('endpointDisplay').textContent = currentPath;
    // Auto-fetch on tab change when a job search is already entered (skip the nag otherwise).
    if (parseJobSearch(document.getElementById('jobId').value).length > 0) doFetch();
  });
});

function resolvedPath(jobId = '') {
  return currentPath.replace('{jobId}', jobId);
}

async function doFetch() {
  const rawSearch = document.getElementById('jobId').value;

  // Special reporting view
  if (currentPath === 'MEASURES') {
    return fetchMeasures(rawSearch);
  }
  if (currentPath === 'USAGE') {
    return fetchUsageBilling(rawSearch);
  }

  let jobId = '';
  if (currentPath.includes('{jobId}')) {
    if (parseJobSearch(rawSearch).length === 0) {
      alert('Enter a Job ID or name.');
      return;
    }
    setBadge('loading', 'Resolving job…');
    const resolved = await resolveJobIds(rawSearch);
    jobId = resolved.jobIds[0] || '';
    if (!jobId) {
      showJobSearchErrors(resolved.errors);
      return;
    }
    if (parseJobSearch(rawSearch).some(term => term.type === 'name') && resolved.jobIds.length > 1) {
      showJobSearchErrors([`Name search matched ${resolved.jobIds.length} jobs. Use Measures or Usage to load all matches, or enter a Job ID for this endpoint.`]);
      return;
    }
  }

  const path = resolvedPath(jobId);
  const url = proxyUrl(path);
  const label = document.querySelector('.nav-item.active')?.dataset.label || path;

  setBadge('loading', 'Fetching…');
  document.getElementById('resultWrap').style.display = 'block';
  document.getElementById('resultTitle').textContent = label;
  document.getElementById('friendly-view').innerHTML = '';
  document.getElementById('rawPre').textContent = '';
  document.getElementById('endpointDisplay').textContent = path;
  setView('friendly');

  try {
    const res = await fetch(url);
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch(_) { data = text; }
    lastData = data;

    if (!res.ok) {
      setBadge('err', `${res.status} ${res.statusText}`);
      document.getElementById('friendly-view').innerHTML = `<div class="err-block">${res.status} — ${typeof data === 'string' ? data : JSON.stringify(data)}</div>`;
      document.getElementById('rawPre').textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
      return;
    }

    setBadge('ok', `${res.status} OK`);
    document.getElementById('rawPre').textContent = JSON.stringify(data, null, 2);
    renderFriendly(data);
  } catch(e) {
    setBadge('err', 'Network error');
    document.getElementById('friendly-view').innerHTML = `<div class="err-block">Request failed: ${e.message}</div>`;
  }
}

// ---------- MEASURES REPORTING VIEW ----------
let measureRows = [];
let sortKey = null;
let sortDir = 1;
let savedDeemedCollapsed = false;
// Reporting context captured at fetch time, for the single-job summary panel.
// Held here rather than re-derived from lastData at render time: lastData is a
// mutable global that other views reassign, which would let the summary describe
// a different job than the rows below it.
let measuresCtx = null;

// job: true marks a per-job fact copied onto every row of that job. Those columns
//   are never summed in the TOTAL row — adding them there would multiply a job-level
//   figure by its line-item count.
// farmworker: true   → only shown on Region 1 / Region 2 (Farmworker) programs.
// noFarmworker: true → hidden on those programs. savingsPct is the tier-basis
//   percentage, and Farmworker programs use SIR instead of tier-based savings, so
//   it stays hidden there for the same reason buildCombinedSummary hides the badges.
const MEASURE_COLS = [
  { key: 'jobId',            label: 'Job',                num: false },
  { key: 'stage',            label: 'Stage',              num: false, job: true },
  { key: 'savingsPct',       label: 'Total Combined Energy Savings %', num: true, job: true, noFarmworker: true },
  { key: 'measure',          label: 'Measure',            num: false },
  { key: 'source',           label: 'Src',                num: false },
  { key: 'name',             label: 'Line Item',          num: false },
  { key: 'code',             label: 'Code',               num: false },
  { key: 'quantity',         label: 'Qty',                num: true  },
  { key: 'unit',             label: 'Unit',               num: false },
  { key: 'costPerUnit',      label: 'Cost/Unit',          num: true  },
  { key: 'lineCost',         label: 'Line Cost',          num: true  },
  { key: 'yrSavings',        label: 'Yr. Savings',        num: true,  group: 'fw', farmworker: true },
  { key: 'lifetimeSavings',  label: 'Savings',            num: true,  group: 'fw', farmworker: true },
  { key: 'sir',              label: 'SIR',                num: true,  group: 'fw', farmworker: true },
  { key: 'savedKwh',         label: 'Saved kWh',          num: true,  group: 'saved'  },
  { key: 'savedTherms',      label: 'Saved Therms',       num: true,  group: 'saved'  },
  { key: 'savedMmbtu',       label: 'Saved MMBTU',        num: true,  group: 'saved'  },
  { key: 'deemedKwh',        label: 'Deemed kWh',         num: true,  group: 'deemed' },
  { key: 'deemedTherms',     label: 'Deemed Therms',      num: true,  group: 'deemed' },
  { key: 'deemedMmbtu',      label: 'Deemed MMBTU',       num: true,  group: 'deemed' },
  { key: 'calcKwh',          label: 'Calculated kWh',     num: true  },
  { key: 'calcTherms',       label: 'Calculated Therms',  num: true  },
  { key: 'calcMmbtu',        label: 'Calculated MMBTU',   num: true  },
  { key: 'yearlyCostSavings', label: 'Yearly Energy Cost Savings', num: true, job: true }
];

function activeMeasureCols() {
  return isFarmworkerProgram()
    ? MEASURE_COLS.filter(c => !c.noFarmworker)
    : MEASURE_COLS.filter(c => !c.farmworker);
}

function num(v) { if (v === null || v === undefined || v === '') return null; const n = Number(v); return isNaN(n) ? null : n; }

// Escape API-supplied text before it goes into an innerHTML string or the XLSX's
// sheet XML. Job titles, line-item names and stage ids are free-form SnuggPro
// fields; on the hosted Worker the page shares an origin with the session cookie.
function esc(v) {
  return String(v).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
}

const STAGE_LABELS = {
  1:'Lead', 2:'Audit', 3:'Bid Proposed', 4:'Bid Approved',
  5:'Retrofit In Progress', 6:'Retrofit Complete', 7:'QA',
  8:'Uncategorized', 9:'Archived Won', 10:'Archived Lost'
};

function isFarmworkerProgram() {
  return selectedProgram === 'region1' || selectedProgram === 'region2';
}

// Map a job's HVAC systems to a reporting code:
//   rDXHP  = Heat Pump
//   rDXGF  = Central AC with Gas Furnace
//   rNCEH  = No CAC, Electric Resistance Heating
//   rNCGF  = No CAC, Gas Furnace
//   rWTD   = Weighted (multiple distinct heating types)
function classifyHvac(data) {
  const hvacs = Array.isArray(data?.hvacs) ? data.hvacs : [];
  if (!hvacs.length) return '';

  let hasHP = false, hasCentralAC = false, hasGasHeat = false, hasElecHeat = false;
  for (const h of hvacs) {
    const eq   = (h.hvacSystemEquipmentType || '').toLowerCase();
    const fuel = h.hvacHeatingEnergySource  || '';
    const isGas = fuel === 'Natural Gas' || fuel === 'Propane';

    if (eq.includes('heat pump'))                                           hasHP        = true;
    if (eq.includes('central ac') || eq.includes('furnace / central ac'))  hasCentralAC = true;
    if ((eq.includes('furnace') || eq.includes('boiler')) && isGas)        hasGasHeat   = true;
    if (eq === 'electric resistance')                                       hasElecHeat  = true;
  }

  if ([hasHP, hasGasHeat, hasElecHeat].filter(Boolean).length > 1) return 'rWTD';
  if (hasHP)                               return 'rDXHP';
  if (hasCentralAC && hasGasHeat)          return 'rDXGF';
  if (!hasCentralAC && hasElecHeat)        return 'rNCEH';
  if (!hasCentralAC && hasGasHeat)         return 'rNCGF';
  return '';
}

// The "deemedAndModeledKwhSavings" incentive carries a metadataJSON blob — a JSON
// array of {key, value}. Both the reporting basis % and the yearly cost savings are
// read out of it, so the find/parse/find lives here once. Returns [] on any
// malformed or missing input; metaNum() then yields null, which every caller treats
// as "not available" rather than as a number.
function incentiveMeta(data) {
  try {
    const ri = (data?.rebatesIncentives || []).find(x => x.code === 'deemedAndModeledKwhSavings');
    if (ri && ri.metadataJSON) {
      const meta = JSON.parse(ri.metadataJSON);
      if (Array.isArray(meta)) return meta;
    }
  } catch(_) {}
  return [];
}

// Always coerce through num(), so ''/null/non-numeric all collapse to null.
// Raw Number() would turn '' into 0 and 'N/A' into NaN, and both survive a
// `== null` check — they'd reach the table and the CSV as a fabricated reading.
function metaNum(data, key) {
  const row = incentiveMeta(data).find(m => m.key === key);
  return row ? num(row.value) : null;
}

// Job stage label, e.g. "Retrofit Complete". '' when the job carries no stage.
function stageLabel(data) {
  const id = data?.job?.stageId ?? data?.stageId;
  if (id === null || id === undefined || id === '') return '';
  return STAGE_LABELS[id] ?? `Stage ${id}`;
}

// Derive savings % and program tier from a job's rebatesIncentives metadata.
// Returns { pct, tier, tierLabel, basisLabel, basisClass }
function getReportingContext(data) {
  const pct = metaNum(data, 'combinedTotalEnergySavings');

  let tier, tierLabel, basisLabel, basisClass;
  if (pct == null) {
    tier = 'review'; tierLabel = 'Unknown';
    basisLabel = 'Unknown — no savings % available'; basisClass = 'basis-warn';
  } else if (pct > 15) {
    tier = 'deep'; tierLabel = 'Deep';
    basisLabel = `Modeled (saved) · ${pct.toFixed(1)}% savings`; basisClass = 'basis-saved';
  } else if (pct >= 5) {
    tier = 'plus'; tierLabel = 'Pilot Plus';
    basisLabel = `Deemed · ${pct.toFixed(1)}% savings`; basisClass = 'basis-deemed';
  } else {
    tier = 'review'; tierLabel = 'Review';
    basisLabel = `Below 5% (${pct.toFixed(1)}%) — review`; basisClass = 'basis-warn';
  }
  return { pct, tier, tierLabel, basisLabel, basisClass };
}

// Yearly Energy Cost Savings ($/yr): job's totals.totalSavings (swagger: "the total
// cost of energy saved by the improved home per year", dollars — modeled savings only,
// same scope as totals.installedCosts which is documented "excluding direct installs").
// Was previously read from rebatesIncentives metadata first; live validation showed
// that metadata value was energy, not dollars, so that source is dropped.
function getYearlyCostSavings(data) {
  return num(data?.totals?.totalSavings);
}

// Compute per-row Calculated value (kWh/Therms/MMBTU) by tier:
//   deep  → saved preferred, deemed fallback  (modeled savings + deemed where no modeled)
//   plus  → deemed preferred, saved fallback  (deemed savings + saved where no deemed)
//   review → deemed-priority default (keeps totals visible even when tier is uncertain)
function calcRowEnergy(savedVal, deemedVal, tier) {
  if (tier === 'deep') return savedVal != null ? savedVal : deemedVal;
  // plus or review: deemed-priority
  return deemedVal != null ? deemedVal : savedVal;
}

// Stamp the tier-derived Calculated columns onto one row. Tier is per-job, so it is
// always passed in — never read from a global, which would apply the last-fetched
// job's tier to every row of a multi-job table.
function stampCalcColumns(r, tier) {
  r.calcKwh    = calcRowEnergy(r.savedKwh,    r.deemedKwh,    tier);
  r.calcTherms = calcRowEnergy(r.savedTherms, r.deemedTherms, tier);
  r.calcMmbtu  = calcRowEnergy(r.savedMmbtu,  r.deemedMmbtu,  tier);
}

function flattenMeasures(data) {
  const rows = [];

  // Recommendations → only active/selected (status "1"); one row per detailedCost line item
  (data.recommendations || []).filter(rec => rec.status == '1').forEach(rec => {
    const recSir      = num(rec.sir);
    const recCost     = num(rec.cost);
    const recSavings  = num(rec.savings);
    const base = {
      measure: rec.title,
      savedKwh: num(rec.savedKwh),
      savedTherms: num(rec.savedTherms),
      savedMmbtu: num(rec.savedMbtu),
      deemedKwh: null, deemedTherms: null, deemedMmbtu: null,
      yrSavings:       recSavings,
      lifetimeSavings: (recSir != null && recCost != null) ? +(recSir * recCost).toFixed(2) : null,
      sir:             recSir
    };
    const costs = rec.detailedCosts || [];
    if (costs.length === 0) {
      // measure with no line items but real savings/cost → keep as a single row
      const c = num(rec.cost);
      const hasValue = c || base.savedKwh || base.savedTherms;
      if (hasValue) rows.push({ ...base, source: 'rec', name: rec.title, code: rec.measureCode || '', quantity: null, unit: '', costPerUnit: null, lineCost: c });
    } else {
      costs.forEach(li => {
        const qty = num(li.quantity);
        const cpu = num(li.costPerUnit);
        rows.push({
          ...base,
          source: 'rec',
          name: li.name || '',
          code: li.code || '',
          quantity: qty,
          unit: li.unit || '',
          costPerUnit: cpu,
          lineCost: (qty != null && cpu != null) ? +(qty * cpu).toFixed(2) : num(rec.cost)
        });
      });
    }
  });

  // Direct installs → one row per line item; deemed savings are PER UNIT, so multiply by quantity
  (data.directInstalls || []).forEach(di => {
    (di.lineItems || []).forEach(li => {
      const qty = num(li.quantity);
      const cpu = num(li.costPerUnit);
      const labor = num(li.laborCostPerUnit) || 0;
      const q = qty == null ? 1 : qty;
      const dk = num(li.deemedAnnualKwhSavings);
      const dt = num(li.deemedThermsSavings);
      const dm = num(li.deemedMmbtuSavings);
      rows.push({
        measure: 'Direct Install',
        source: 'DI',
        name: li.name ? li.name.trim() : '',
        code: li.code || '',
        quantity: qty,
        unit: li.unit || '',
        costPerUnit: cpu,
        lineCost: (qty != null && cpu != null) ? +(qty * (cpu + labor)).toFixed(2) : null,
        savedKwh: null, savedTherms: null, savedMmbtu: null,
        deemedKwh: dk == null ? null : +(dk * q).toFixed(4),
        deemedTherms: dt == null ? null : +(dt * q).toFixed(4),
        deemedMmbtu: dm == null ? null : +(dm * q).toFixed(6)
      });
    });
  });

  return rows;
}

// Commas are the universal separator. A comma-delimited entry made only of
// numbers can still contain whitespace-separated IDs, preserving the original
// batch syntax. Any entry containing other characters is kept intact as a name,
// so "Jane Doe" is one search instead of two broken IDs. Mixed names and IDs
// must be comma-separated: "Jane Doe, 123456".
function parseJobSearch(raw) {
  const terms = [];
  String(raw || '').split(',').forEach(part => {
    const value = part.trim();
    if (!value) return;
    if (/^\d+(?:\s+\d+)*$/.test(value)) {
      value.split(/\s+/).forEach(id => terms.push({ type: 'id', value: id }));
    } else {
      terms.push({ type: 'name', value });
    }
  });

  const seen = new Set();
  return terms.filter(term => {
    const key = `${term.type}:${term.value.toLocaleLowerCase()}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function parseJobIds(raw) {
  return parseJobSearch(raw).filter(term => term.type === 'id').map(term => term.value);
}

function normalizeJobName(value) {
  return String(value || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLocaleLowerCase()
    .replace(/\s+/g, ' ')
    .trim();
}

const jobListCache = new Map();
const JOB_INDEX_CONCURRENCY = 8;

async function fetchJobList() {
  const program = selectedProgram;
  const cached = jobListCache.get(program);
  if (cached) return cached;

  // Cache the in-flight build as well as the finished index. A double-click or
  // tab switch during the first search must not launch a second hydration sweep.
  const loading = (async () => {
    const programUrl = apiPath => `/proxy${apiPath}?program=${program}`;
    const res = await fetch(programUrl('/jobs'));
    const text = await res.text();
    let roster;
    try { roster = JSON.parse(text); } catch (_) { roster = null; }
    if (!res.ok || !Array.isArray(roster)) {
      throw new Error(`${res.status} ${res.statusText}`.trim());
    }

    // The live API currently returns only { id, altId } from /jobs even though
    // its published schema describes full job records. Hydrate those lightweight
    // entries from /jobs/{id} once per program/session so name searches are real,
    // then keep the index in memory. Existing /all-data cache hits are reused.
    if (roster.some(job => job.firstName || job.lastName)) {
      return { jobs: roster, failed: 0 };
    }

    const jobs = new Array(roster.length).fill(null);
    let next = 0;
    let completed = 0;
    let failed = 0;

    async function worker() {
      while (next < roster.length) {
        const i = next++;
        const rosterJob = roster[i];
        const id = rosterJob.id ?? rosterJob.jobId;
        const cachedData = jobDataCache.get(`${program}:${id}`);
        if (cachedData?.job) {
          jobs[i] = cachedData.job;
          completed++;
          continue;
        }

        try {
          const detailRes = await fetch(programUrl(`/jobs/${encodeURIComponent(id)}`));
          const detailText = await detailRes.text();
          let detail;
          try { detail = JSON.parse(detailText); } catch (_) { detail = null; }
          if (!detailRes.ok || !detail) failed++;
          else jobs[i] = detail.job || detail;
        } catch (_) {
          failed++;
        }

        completed++;
        if (completed === roster.length || completed % 25 === 0) {
          setBadge('loading', `Indexing names ${completed}/${roster.length}…`);
        }
      }
    }

    const lanes = Math.min(JOB_INDEX_CONCURRENCY, roster.length);
    await Promise.all(Array.from({ length: lanes }, worker));
    return { jobs: jobs.filter(Boolean), failed };
  })();

  jobListCache.set(program, loading);
  try {
    const complete = await loading;
    jobListCache.set(program, complete);
    return complete;
  } catch (error) {
    if (jobListCache.get(program) === loading) jobListCache.delete(program);
    throw error;
  }
}

async function resolveJobIds(raw) {
  const terms = parseJobSearch(raw);
  const nameTerms = terms.filter(term => term.type === 'name');
  let jobs = [];
  let indexFailures = 0;

  if (nameTerms.length) {
    try {
      const index = await fetchJobList();
      jobs = index.jobs;
      indexFailures = index.failed;
    } catch (error) {
      return { jobIds: [], errors: [`Could not search jobs by name: ${error.message}`] };
    }
  }

  const jobIds = [];
  const errors = [];
  terms.forEach(term => {
    if (term.type === 'id') {
      jobIds.push(term.value);
      return;
    }

    const query = normalizeJobName(term.value);
    const exact = jobs.filter(job => normalizeJobName(`${job.firstName || ''} ${job.lastName || ''}`) === query);
    const candidates = exact.length ? exact : jobs.filter(job => {
      const name = normalizeJobName(`${job.firstName || ''} ${job.lastName || ''}`);
      return query.split(' ').every(token => name.includes(token));
    });
    const matches = candidates
      .map(job => job.id ?? job.jobId)
      .filter(id => id !== null && id !== undefined && String(id).trim());

    if (matches.length === 0) errors.push(`No jobs matched name “${term.value}”.`);
    else jobIds.push(...matches.map(String));
  });

  if (indexFailures) {
    errors.push(`Name index could not read ${indexFailures} job record${indexFailures === 1 ? '' : 's'}.`);
  }

  // Deduplicate after names have resolved to IDs. This catches both repeated
  // input and the same job supplied once by ID and again by customer name.
  return { jobIds: [...new Set(jobIds)], errors };
}

function showJobSearchErrors(errors) {
  const messages = errors.length ? errors : ['No matching jobs found.'];
  setBadge('err', 'No matching jobs');
  document.getElementById('resultWrap').style.display = 'block';
  document.getElementById('resultTitle').textContent = 'Job search';
  document.getElementById('rawPre').textContent = '';
  document.getElementById('friendly-view').innerHTML = `<div class="err-block">${messages.map(esc).join('<br/>')}</div>`;
}

// How many /jobs/{id}/all-data requests to keep in flight. The jobs are
// independent, so fetching them one at a time made a 10-job batch take 10x
// longer than it needs to; capped so a large batch doesn't stampede the API.
const JOB_FETCH_CONCURRENCY = 6;

// Raw /all-data payloads from this session, so that fetching a batch into a view
// and then exporting it doesn't pull every job over the wire a second time.
// Keyed by program as well as job id: the same job id signed against a different
// program is a different request, and its response must not be reused across the
// program switcher. Only successful responses are cached — a failed job stays a
// miss so the next attempt actually retries it.
const jobDataCache = new Map();
const jobCacheKey = jobId => `${selectedProgram}:${jobId}`;

// Load /jobs/{id}/all-data for every id. Returns { data, errors }: `data` is
// index-aligned with jobIds (null where the job failed) and `errors` is in
// jobIds order regardless of which response landed first.
//
// Cached jobs are served without a request. Pass { refresh: true } from an
// explicit user-initiated fetch so hitting Fetch always re-reads the job; the
// exports deliberately don't, so they reuse whatever the view just loaded.
async function fetchJobsAllData(jobIds, { refresh = false } = {}) {
  const data = new Array(jobIds.length).fill(null);
  const errs = new Array(jobIds.length).fill(null);

  // Resolve cache hits up front; only the misses get a lane.
  const pending = [];
  jobIds.forEach((jobId, i) => {
    const hit = refresh ? undefined : jobDataCache.get(jobCacheKey(jobId));
    if (hit) data[i] = hit;
    else pending.push(i);
  });

  let next = 0;

  async function worker() {
    while (next < pending.length) {
      const i = pending[next++];
      const jobId = jobIds[i];
      try {
        const res = await fetch(proxyUrl(`/jobs/${jobId}/all-data`));
        const text = await res.text();
        let parsed;
        try { parsed = JSON.parse(text); } catch(_) { parsed = null; }
        if (!res.ok || !parsed) errs[i] = `Job ${jobId}: ${res.status} ${res.statusText}`;
        else {
          data[i] = parsed;
          jobDataCache.set(jobCacheKey(jobId), parsed);
        }
      } catch(_) {
        errs[i] = `Job ${jobId}: network error`;
      }
    }
  }

  const lanes = Math.min(JOB_FETCH_CONCURRENCY, pending.length);
  await Promise.all(Array.from({ length: lanes }, worker));
  return { data, errors: errs.filter(Boolean) };
}

async function fetchMeasures(rawIds) {
  if (parseJobSearch(rawIds).length === 0) { alert('Enter at least one Job ID or name.'); return; }
  setBadge('loading', 'Resolving jobs…');
  const resolved = await resolveJobIds(rawIds);
  const jobIds = resolved.jobIds;
  if (jobIds.length === 0) { showJobSearchErrors(resolved.errors); return; }

  const multi = jobIds.length > 1;
  setBadge('loading', multi ? `Fetching ${jobIds.length} jobs…` : 'Fetching…');
  document.getElementById('resultWrap').style.display = 'block';
  document.getElementById('resultTitle').textContent = 'Measures Table';
  document.getElementById('friendly-view').innerHTML = `<div style="padding:20px;color:#888">Loading ${multi ? jobIds.join(', ') : jobIds[0]}…</div>`;
  document.getElementById('rawPre').textContent = '';
  document.getElementById('endpointDisplay').textContent = multi ? `${jobIds.length} jobs` : `/jobs/${jobIds[0]}/all-data`;
  setView('friendly');

  const fetched = await fetchJobsAllData(jobIds, { refresh: true });
  const jobData = fetched.data;
  const errors = [...resolved.errors, ...fetched.errors];

  const allRows = [];
  let combinedData = null; // last successful job's data — backs the raw JSON pane

  jobIds.forEach((jobId, i) => {
    const data = jobData[i];
    if (!data) return;
    combinedData = data;
    // Derive the context per-job so multi-job rows are stamped independently
    const ctx = getReportingContext(data);
    const jobStage = stageLabel(data);
    const jobCostSavings = getYearlyCostSavings(data);
    const rows = flattenMeasures(data);
    rows.forEach(r => {
      r.jobId = jobId;
      r.stage = jobStage;
      r.savingsPct = ctx.pct;
      r.yearlyCostSavings = jobCostSavings;
      stampCalcColumns(r, ctx.tier);
    });
    allRows.push(...rows);
  });

  if (allRows.length === 0) {
    setBadge('err', 'No data');
    document.getElementById('friendly-view').innerHTML =
      `<div class="err-block">${errors.map(esc).join('<br/>') || 'No data returned. Check the Job ID and selected program.'}</div>`;
    return;
  }

  lastData = combinedData;
  document.getElementById('rawPre').textContent = JSON.stringify(combinedData, null, 2);
  measureRows = allRows;
  activeJobIds = jobIds;
  // Capture the summary context now, against the job actually on screen, so later
  // re-renders (sort, collapse) can't pick up a different job's numbers.
  measuresCtx = { ...getReportingContext(combinedData), stage: stageLabel(combinedData) };
  sortKey = null;
  const errNote = errors.length ? ` · ${errors.length} failed` : '';
  setBadge(errors.length ? 'err' : 'ok', `${measureRows.length} line items${errNote}`);
  renderMeasures();
}

function buildCombinedSummary() {
  const s = { savedKwh:0, savedTherms:0, savedMmbtu:0, deemedKwh:0, deemedTherms:0, deemedMmbtu:0 };
  measureRows.forEach(r => Object.keys(s).forEach(k => { if (typeof r[k] === 'number') s[k] += r[k]; }));

  const combinedKwh = s.savedKwh + s.deemedKwh;
  const combinedTherms = s.savedTherms + s.deemedTherms;
  const combinedMmbtu = s.savedMmbtu + s.deemedMmbtu;

  const jobIds = [...new Set(measureRows.map(r => r.jobId).filter(Boolean))];
  const multi = jobIds.length > 1;

  const card = (label, val, unit) =>
    `<div class="csum-card"><div class="csum-label">${label}</div><div class="csum-val">${val.toFixed(2)}<span class="csum-unit">${unit}</span></div></div>`;

  let h = '<div class="combined-summary">';

  if (!multi && measuresCtx) {
    const { stage, tier, tierLabel, basisLabel, basisClass } = measuresCtx;
    const farmworker = isFarmworkerProgram();
    const tierBadgeClass = tier === 'deep' ? 'basis-saved' : tier === 'plus' ? 'basis-deemed' : 'basis-warn';

    h += `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">`;
    if (stage) h += `<div class="csum-basis" style="margin-bottom:0;background:#f0f0f0;color:#444">Stage: <strong>${esc(stage)}</strong></div>`;
    if (!farmworker) {
      h += `<div class="csum-basis ${basisClass}" style="margin-bottom:0">Reporting basis: <strong>${basisLabel}</strong></div>`;
      h += `<div class="csum-basis ${tierBadgeClass}" style="margin-bottom:0">Customer tier: <strong>${tierLabel}</strong></div>`;
    }
    h += `</div>`;
  }

  h += '<div class="csum-grid">';
  h += card('Combined kWh', combinedKwh, 'kWh');
  h += card('Combined Therms', combinedTherms, 'thm');
  h += card('Combined MMBTU', combinedMmbtu, 'MMBTU');
  h += '</div>';
  h += `<div class="csum-breakdown">Modeled ${s.savedKwh.toFixed(2)} kWh / ${s.savedTherms.toFixed(2)} thm &nbsp;·&nbsp; Deemed ${s.deemedKwh.toFixed(2)} kWh / ${s.deemedTherms.toFixed(2)} thm</div>`;
  h += '</div>';
  return h;
}

// Columns the TOTAL row sums. Job-scoped columns (job: true in MEASURE_COLS) are
// deliberately absent: their value is a per-job constant repeated on every row, so
// summing it would report the figure multiplied by the line-item count.
const TOTAL_KEYS = ['quantity', 'lineCost', 'yrSavings', 'lifetimeSavings',
  'savedKwh', 'savedTherms', 'savedMmbtu', 'deemedKwh', 'deemedTherms', 'deemedMmbtu',
  'calcKwh', 'calcTherms', 'calcMmbtu'];

function renderMeasures() {
  const rows = [...measureRows];
  if (sortKey) {
    const col = MEASURE_COLS.find(c => c.key === sortKey);
    rows.sort((a, b) => {
      let x = a[sortKey], y = b[sortKey];
      if (col.num) { x = x == null ? -Infinity : x; y = y == null ? -Infinity : y; return (x - y) * sortDir; }
      x = (x || '').toString().toLowerCase(); y = (y || '').toString().toLowerCase();
      return x < y ? -sortDir : x > y ? sortDir : 0;
    });
  }

  // Totals, source counts and the distinct-job set — one pass over the rows.
  const tot = {};
  TOTAL_KEYS.forEach(k => { tot[k] = 0; });
  const jobSet = new Set();
  let recCount = 0, diCount = 0;
  rows.forEach(r => {
    for (const k of TOTAL_KEYS) { if (typeof r[k] === 'number') tot[k] += r[k]; }
    if (r.jobId) jobSet.add(r.jobId);
    if (r.source === 'rec') recCount++; else if (r.source === 'DI') diCount++;
  });

  const jobNote = jobSet.size > 1 ? ` · <strong>${jobSet.size}</strong> jobs` : '';
  let html = '<div class="measures-toolbar">';
  html += `<span class="summary"><strong>${rows.length}</strong> line items${jobNote} · <span class="src-rec">REC</span> ${recCount} · <span class="src-di">DI</span> ${diCount}</span>`;
  html += '<div class="spacer"></div>';
  const collapseLabel = savedDeemedCollapsed ? 'Show Saved/Deemed' : 'Hide Saved/Deemed';
  html += `<button class="tool-btn${savedDeemedCollapsed ? ' active' : ''}" onclick="toggleSavedDeemed()">${collapseLabel}</button>`;
  html += '<button class="csv-btn" onclick="exportMeasuresCsv()">Download CSV</button>';
  html += '</div>';

  html += buildCombinedSummary();

  const CALC_KEYS = new Set(['calcKwh', 'calcTherms', 'calcMmbtu']);
  const colGroup = c => CALC_KEYS.has(c.key) ? 'col-calc' : c.group === 'fw' ? 'col-fw' : c.group === 'saved' ? 'col-saved' : c.group === 'deemed' ? 'col-deemed' : '';
  const cols = activeMeasureCols();

  const tableClass = `measures${savedDeemedCollapsed ? ' hide-saved-deemed' : ''}`;
  html += `<div class="table-scroll"><table class="${tableClass}"><thead><tr>`;
  cols.forEach(c => {
    const arrow = sortKey === c.key ? `<span class="arrow">${sortDir === 1 ? '▲' : '▼'}</span>` : '';
    const grpCls = colGroup(c);
    html += `<th${grpCls ? ` class="${grpCls}"` : ''} onclick="sortMeasures('${c.key}')">${c.label}${arrow}</th>`;
  });
  html += '</tr></thead><tbody>';

  rows.forEach(r => {
    html += '<tr>';
    cols.forEach(c => {
      let v = r[c.key];
      const grpCls = colGroup(c);
      if (c.key === 'source') {
        html += `<td${grpCls ? ` class="${grpCls}"` : ''}><span class="${v === 'rec' ? 'src-rec' : 'src-di'}">${v === 'rec' ? 'REC' : 'DI'}</span></td>`;
        return;
      }
      if (c.num) {
        const display = v == null ? '' : (Number.isInteger(v) ? v : v.toFixed(2));
        const neg = (typeof v === 'number' && v < 0) ? ' neg' : '';
        const copyAttr = v == null ? '' : ` data-copy="${v}" onclick="copyCell(this)" title="Click to copy"`;
        const cls = ['num', neg, grpCls, 'copyable'].filter(Boolean).join(' ');
        html += `<td class="${cls}"${copyAttr}>${display}</td>`;
      } else {
        const measureCls = c.key === 'measure' ? 'measure-cell' : '';
        const copyAttr = (v == null || v === '') ? '' : ` data-copy="${esc(v)}" onclick="copyCell(this)" title="Click to copy"`;
        const copyable = (v != null && v !== '') ? 'copyable' : '';
        const cls = [measureCls, grpCls, copyable].filter(Boolean).join(' ');
        html += `<td${cls ? ` class="${cls}"` : ''}${copyAttr}>${v == null ? '' : esc(v)}</td>`;
      }
    });
    html += '</tr>';
  });

  // Totals row. SIR is a ratio and job-scoped columns are per-job constants —
  // neither is summable, so both render blank.
  html += '<tr style="border-top:2px solid #ddd;font-weight:600;background:#fafafa">';
  cols.forEach(c => {
    const grpCls = colGroup(c);
    if (c.key === 'measure') { html += '<td class="measure-cell">TOTAL</td>'; return; }
    if (c.key === 'sir' || c.job) {
      const cls = [c.num || c.key === 'sir' ? 'num' : '', grpCls].filter(Boolean).join(' ');
      html += `<td${cls ? ` class="${cls}"` : ''}></td>`;
      return;
    }
    if (c.num && tot[c.key] !== undefined) {
      const v = tot[c.key];
      const display = Number.isInteger(v) ? v : v.toFixed(2);
      const cls = ['num', grpCls].filter(Boolean).join(' ');
      html += `<td class="${cls}">${display}</td>`;
    } else { html += `<td${grpCls ? ` class="${grpCls}"` : ''}></td>`; }
  });
  html += '</tr>';

  html += '</tbody></table></div>';
  document.getElementById('friendly-view').innerHTML = html;
}

function copyCell(el) {
  const val = el.getAttribute('data-copy');
  if (val == null) return;
  navigator.clipboard?.writeText(val);
  el.classList.add('copied');

}

// Build a clean, comma/space-free filename token from the Job ID input.
//   1 job  -> job_123456      2-3 jobs -> jobs_123456-234567      4+ -> 5jobs
// Save an export file. Against the local proxy.js, POST /exports lands it in the
// repo's exports/ folder; on the hosted Worker that route doesn't exist, so fall
// back to a normal browser download. Never put path separators in a.download —
// browsers strip them, they can't create subfolders.
async function saveOrDownload(blob, filename) {
  try {
    const res = await fetch(`/exports?filename=${encodeURIComponent(filename)}`, { method: 'POST', body: blob });
    if (res.ok) { setBadge('ok', `Saved to exports/${filename}`); return; }
  } catch (_) {}
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

let activeJobIds = [];

function jobFileTag() {
  const ids = activeJobIds.map(s => String(s).replace(/[^\w.-]/g, ''));
  if (ids.length === 0) return 'export';
  if (ids.length === 1) return `job_${ids[0]}`;
  if (ids.length <= 3) return `jobs_${ids.join('-')}`;
  return `${ids.length}jobs`;
}

function exportMeasuresCsv() {
  const cols = activeMeasureCols();
  const headers = cols.map(c => c.label);
  const lines = [headers.join(',')];
  measureRows.forEach(r => {
    const cells = cols.map(c => {
      let v = r[c.key];
      if (v === null || v === undefined) return '';
      v = String(v);
      if (v.includes(',') || v.includes('"') || v.includes('\n')) v = '"' + v.replace(/"/g, '""') + '"';
      return v;
    });
    lines.push(cells.join(','));
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  saveOrDownload(blob, `measures_${jobFileTag()}.csv`);
}

  { key: 'jobId',      label: 'Job',         num: false },
  { key: 'fuel',       label: 'Fuel',        num: false },
  { key: 'startDate',  label: 'Bill Start',  num: false },

  { key: 'mmbtu',      label: 'MMBTU',       num: true  }
];

// Standard energy-content conversions to MMBTU (1 MMBTU = 1,000,000 BTU).
const KWH_TO_MMBTU = 3412.14 / 1e6; // 1 kWh = 3,412.14 BTU
const THERM_TO_MMBTU = 0.1;         // 1 therm = 100,000 BTU

function daysBetween(a, b) {
  const ms = Date.parse(b) - Date.parse(a);
  return Number.isNaN(ms) ? null : Math.round(ms / 86400000);
}

// Normalize whatever the API returns (ISO date, ISO datetime, or a verbose
// "Mon Jun 23 2026 00:00:00 GMT+0000 (…)" string) to a plain YYYY-MM-DD.
function fmtDate(v) {
  if (!v) return '';
  const s = String(v);
  const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);   // already starts ISO -> slice, no TZ math
  if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;
  const t = Date.parse(s);
  if (Number.isNaN(t)) return s;                      // unparseable -> leave as-is
  const d = new Date(t);
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${m}-${day}`;
}

// Walk the flat, numbered bill series under data.utilities into one row per fuel
// per billing period. Period N spans (prior read date -> end*Date N); usage =
// end*Bill N. Period 1's start is start*Date1; later periods start at the prior
// end date. mmbtu is computed from usage only when units are energy units.
function flattenUsage(data) {
  const u = data && data.utilities;
  if (!u) return [];
  const rows = [];

  function series(fuel, startKey, datePrefix, billPrefix, units, toMmbtu) {
    let prev = u[startKey];
    for (let i = 1; i <= 13; i++) {
      const end = u[datePrefix + i];
      if (!end) break; // series ended
      const usage = num(u[billPrefix + i]);
      const mmbtu = (usage != null && toMmbtu != null) ? +(usage * toMmbtu).toFixed(6) : null;
      rows.push({
        fuel,
        startDate: fmtDate(prev),
        endDate: fmtDate(end),
        billedDays: prev ? daysBetween(prev, end) : null,
        usage,
        units: units || '',
        mmbtu
      });
      prev = end;
    }
  }

  const eUnits = u.electricBillUnits || '';
  series('Electric', 'startElectricDate1', 'endElectricDate', 'endElectricBill',
         eUnits, eUnits === 'kWh' ? KWH_TO_MMBTU : null);

  const fUnits = u.fuelBillUnits || '';
  series('Gas', 'startFuelDate1', 'endFuelDate', 'endFuelBill',
         fUnits, fUnits === 'Therms' ? THERM_TO_MMBTU : null);

  return rows;
}

async function fetchUsageBilling(rawIds) {
  if (parseJobSearch(rawIds).length === 0) { alert('Enter at least one Job ID or name.'); return; }
  setBadge('loading', 'Resolving jobs…');
  const resolved = await resolveJobIds(rawIds);
  const jobIds = resolved.jobIds;
  if (jobIds.length === 0) { showJobSearchErrors(resolved.errors); return; }

  const multi = jobIds.length > 1;
  setBadge('loading', multi ? `Fetching ${jobIds.length} jobs…` : 'Fetching…');
  document.getElementById('resultWrap').style.display = 'block';
  document.getElementById('resultTitle').textContent = 'Usage / Billing';
  document.getElementById('friendly-view').innerHTML = `<div style="padding:20px;color:#888">Loading ${multi ? jobIds.join(', ') : jobIds[0]}…</div>`;
  document.getElementById('rawPre').textContent = '';
  document.getElementById('endpointDisplay').textContent = multi ? `${jobIds.length} jobs` : `/jobs/${jobIds[0]}/all-data`;
  setView('friendly');

  const fetched = await fetchJobsAllData(jobIds, { refresh: true });
  const jobData = fetched.data;
  const errors = [...resolved.errors, ...fetched.errors];

  const allRows = [];
  let lastUtilities = null;

  jobIds.forEach((jobId, i) => {
    const data = jobData[i];
    if (!data) return;
    if (data.utilities) lastUtilities = data.utilities;
    const rows = flattenUsage(data);
    rows.forEach(r => { r.jobId = jobId; });
    allRows.push(...rows);
  });

  if (allRows.length === 0) {
    setBadge('err', 'No data');
    document.getElementById('friendly-view').innerHTML =
      `<div class="err-block">${errors.map(esc).join('<br/>') || 'No periodic utility bills found for this job (it may use Simple/No-Bills entry).'}</div>`;
    return;
  }

  document.getElementById('rawPre').textContent = JSON.stringify(lastUtilities, null, 2);
  usageRows = allRows;
  activeJobIds = jobIds;
  setBadge('ok', errors.length ? `Loaded · ${errors.length} error(s)` : `${allRows.length} bills`);
  renderUsage();
}

function renderFriendly(data) {
  const el = document.getElementById('friendly-view');

  if (typeof data !== 'object') { el.innerHTML = `<div style="padding:16px;font-family:monospace;font-size:13px;">${data}</div>`; return; }

  const arr = Array.isArray(data) ? data : [data];
  if (arr.length === 0) { el.innerHTML = '<div class="empty-state">No records returned</div>'; return; }

  let html = '';
  const priorityKeys = ['id','job_id','uuid','address','city','state','zip','county','status','stage','name','first_name','last_name','full_name','email','phone','created_at','updated_at','service_time','account_id','company_id','program_id'];

  arr.forEach((item, idx) => {
    if (typeof item !== 'object' || !item) { html += `<div class="field-card" style="margin:4px 0"><div class="field-val">${item}</div></div>`; return; }

    if (arr.length > 1) html += `<div class="section-label">Record ${idx + 1}</div>`;

    const allKeys = Object.keys(item);
    const ordered = [...new Set([...priorityKeys.filter(k => k in item), ...allKeys])];
    const flat = ordered.filter(k => { const v = item[k]; return v === null || v === undefined || typeof v !== 'object'; });
    const nested = ordered.filter(k => { const v = item[k]; return v !== null && v !== undefined && typeof v === 'object'; });

    html += '<div class="field-grid">';
    flat.forEach(k => {
      const v = item[k];
      const display = v === null || v === undefined || v === '' ? '—' : String(v);
      const nullClass = (v === null || v === undefined || v === '') ? ' null-val' : '';
      html += `<div class="field-card"><div class="field-key">${k}</div><div class="field-val${nullClass}">${display}</div></div>`;
    });
    html += '</div>';

    nested.forEach(k => {
      const sub = item[k];
      html += `<div class="section-label">${k}</div>`;
      if (Array.isArray(sub)) {
        if (sub.length === 0) { html += '<div style="color:#aaa;font-size:12px;margin-bottom:12px">Empty array</div>'; return; }
        sub.forEach((s, i) => {
          if (typeof s !== 'object' || !s) { html += `<div class="array-item"><div class="field-val">${s}</div></div>`; return; }
          html += `<div class="array-item"><div class="array-item-header">Item ${i + 1}</div><div class="field-grid">`;
          Object.keys(s).forEach(sk => {
            const sv = s[sk];
            const display = sv === null || sv === undefined || sv === '' ? '—' : (typeof sv === 'object' ? JSON.stringify(sv) : String(sv));
            const nullClass = (sv === null || sv === undefined || sv === '') ? ' null-val' : '';
            html += `<div class="field-card"><div class="field-key">${sk}</div><div class="field-val${nullClass}">${display}</div></div>`;
          });
          html += '</div></div>';
        });
      } else {
        html += '<div class="field-grid">';
        Object.keys(sub).forEach(sk => {
          const sv = sub[sk];
          const display = sv === null || sv === undefined || sv === '' ? '—' : (typeof sv === 'object' ? JSON.stringify(sv) : String(sv));
          const nullClass = (sv === null || sv === undefined || sv === '') ? ' null-val' : '';
          html += `<div class="field-card"><div class="field-key">${sk}</div><div class="field-val${nullClass}">${display}</div></div>`;
        });
        html += '</div>';
      }
    });

    if (idx < arr.length - 1) html += '<hr class="divider" />';
  });

  el.innerHTML = html;
}

// ---------- XLSX EXPORT ----------
// Uses JSZip to patch the template ZIP directly, avoiding SheetJS's table round-trip
// limitation (SheetJS CE drops xl/tables/*.xml files on write).

function colIdxToLetter(idx) {
  if (idx < 26) return String.fromCharCode(65 + idx);
  return String.fromCharCode(64 + Math.floor(idx / 26)) + String.fromCharCode(65 + (idx % 26));
}

function buildRowXml(rowNum, values) {
  let xml = `<row r="${rowNum}" spans="1:${values.length}">`;
  values.forEach((val, i) => {
    if (val == null || val === '') return;
    const ref = colIdxToLetter(i) + rowNum;
    if (typeof val === 'number') {
      xml += `<c r="${ref}"><v>${val}</v></c>`;
    } else {
      xml += `<c r="${ref}" t="inlineStr"><is><t>${esc(val)}</t></is></c>`;
    }
  });
  return xml + '</row>';
}

// Keeps template header row (row 1) as-is; replaces all data rows with new ones.
function patchSheetXml(sheetXml, dataRows, numCols) {
  const headerMatch = sheetXml.match(/<row r="1"[\s\S]*?<\/row>/);
  const headerRow = headerMatch ? headerMatch[0] : '';
  const dataXml = dataRows.map((vals, i) => buildRowXml(i + 2, vals)).join('');
  const newSheetData = `<sheetData>${headerRow}${dataXml}</sheetData>`;
  const lastRow = dataRows.length + 1;
  const lastCol = colIdxToLetter(numCols - 1);
  return sheetXml
    .replace(/<sheetData>[\s\S]*?<\/sheetData>/, newSheetData)
    .replace(/(<dimension ref=")[^"]*(")/,  `$1A1:${lastCol}${lastRow}$2`);
}

// Parse the shared string table from xl/sharedStrings.xml into an index array.
function parseSharedStrings(ssXml) {
  const strings = [];
  const siRe = /<si>([\s\S]*?)<\/si>/g;
  let sm;
  while ((sm = siRe.exec(ssXml)) !== null) {
    const parts = [];
    const tRe = /<t[^>]*>([^<]*)<\/t>/g;
    let tm;
    while ((tm = tRe.exec(sm[1])) !== null) parts.push(tm[1]);
    strings.push(parts.join(''));
  }
  return strings;
}

// Extract the text value of each cell in row 1 of a sheet XML.
// Handles both shared strings (t="s") and inline strings (t="inlineStr").
function extractHeaderNames(sheetXml, sharedStrings) {
  const headerMatch = sheetXml.match(/<row r="1"[\s\S]*?<\/row>/);
  if (!headerMatch) return [];
  const names = [];
  const cellRe = /<c r="[A-Z]+1"([^>]*)>([\s\S]*?)<\/c>/g;
  let cm;
  while ((cm = cellRe.exec(headerMatch[0])) !== null) {
    const typeM = cm[1].match(/\bt="([^"]*)"/);
    const cellType = typeM ? typeM[1] : '';
    const inner = cm[2];
    if (cellType === 's') {
      const vM = inner.match(/<v>(\d+)<\/v>/);
      names.push(vM ? (sharedStrings[+vM[1]] || '') : '');
    } else if (cellType === 'inlineStr') {
      const tM = inner.match(/<t[^>]*>([^<]*)<\/t>/);
      names.push(tM ? tM[1] : '');
    } else {
      const vM = inner.match(/<v>([^<]*)<\/v>/);
      names.push(vM ? vM[1] : '');
    }
  }
  return names;
}

// Updates ref + autoFilter ref and rebuilds <tableColumns> to match the actual headers,
// fixing the mismatch that causes Excel to repair/remove the table.
function patchTableXml(tableXml, newRef, columnNames) {
  let out = tableXml
    .replace(/(<table\b[^>]* ref=")[^"]*(")/,       `$1${newRef}$2`)
    .replace(/(<autoFilter\b[^>]* ref=")[^"]*(")/,  `$1${newRef}$2`);
  if (columnNames && columnNames.length) {
    const colsXml = columnNames.map((n, i) =>
      `<tableColumn id="${i + 1}" name="${esc(n || ('Column' + (i + 1)))}"/>`
    ).join('');
    out = out.replace(/<tableColumns[\s\S]*?<\/tableColumns>/,
      `<tableColumns count="${columnNames.length}">${colsXml}</tableColumns>`);
  }
  return out;
}

async function exportXlsx() {
  const rawIds = document.getElementById('jobId').value.trim();
  if (parseJobSearch(rawIds).length === 0) { alert('Enter at least one Job ID or name.'); return; }

  setBadge('loading', 'Resolving jobs…');
  const resolved = await resolveJobIds(rawIds);
  const jobIds = resolved.jobIds;
  if (jobIds.length === 0) { showJobSearchErrors(resolved.errors); return; }
  activeJobIds = jobIds;
  setBadge('loading', 'Building XLSX…');

  let tplBuf;
  try {
    const tplRes = await fetch('/template_range.xlsx');
    if (!tplRes.ok) { alert('template_range.xlsx not found — contact your administrator.'); setBadge('err', 'No template'); return; }
    tplBuf = await tplRes.arrayBuffer();
  } catch(e) { alert('Could not load template.'); setBadge('err', 'Template error'); return; }

  const mainOut = [], measuresOut = [], elecOut = [], gasOut = [];
  const fetched = await fetchJobsAllData(jobIds);
  const jobData = fetched.data;
  const errors = [...resolved.errors, ...fetched.errors];

  jobIds.forEach((jobId, i) => {
    const data = jobData[i];
    if (!data) return;

    // Note: lastData is deliberately NOT reassigned here. The Measures table and its
    // summary panel may be on screen for a different job; repointing the global made
    // the summary describe this job instead on the next re-render.
    const { pct, tier } = getReportingContext(data);

    // Sheet1: AuditId, Path, Savings %, TypeOfHome, HVAC
    const path = tier === 'deep' ? 'Pilot Deep' : tier === 'plus' ? 'Pilot Plus' : '';
    const typeOfHome = data?.house?.typeOfHome ?? data?.typeOfHome ?? '';
    mainOut.push([jobId, path, pct != null ? +pct.toFixed(2) : '', typeOfHome, classifyHvac(data)]);

    // Column order MUST match sheet2's header row (A..S), which is the reporting
    // upload schema in A..J followed by the backing detail in K..S:
    //   A AuditId  B ReportingCode  C Code  D MeasureQty  E Unit
    //   F SavedkWh  G kW  H SavedTherms  I SavedMBTUs  J MeasureCostOverride
    //   K Measure  L Src  M Cost/Unit
    //   N..P Saved kWh/Therms/MMBTU   Q..S Deemed kWh/Therms/MMBTU
    // A..J is what gets reported, so F/H/I carry the tier-basis calculated figures;
    // N..S keep the modeled and deemed breakdown they were derived from. G (kW) has
    // no source in /all-data and is left blank.
    // The sheet layout is fixed by the template, so the Stage and Yearly Energy Cost
    // Savings columns shown in the table and CSV are not carried here.
    flattenMeasures(data).forEach(r => {
      stampCalcColumns(r, tier);
      measuresOut.push([
        jobId, r.measure, r.code, r.quantity, r.unit,
        r.calcKwh, null, r.calcTherms, r.calcMmbtu, r.lineCost,
        r.name, r.source, r.costPerUnit,
        r.savedKwh, r.savedTherms, r.savedMmbtu,
        r.deemedKwh, r.deemedTherms, r.deemedMmbtu
      ]);
    });

    // Column order: table3 = AuditId,Fuel,ElectricBillStartDate,ElectricBillEndDate,Billed Days,ElectricMonthkWhUsage,Units,MMBTU
    // Column order: table4 = AuditId,Fuel,GasBillStartDate,Gas End,GasBilledDays,GasMonthThermsUsage,Units,MMBTU
    flattenUsage(data).forEach(r => {
      if (r.fuel === 'Electric') {
        elecOut.push([jobId, 'Electric', r.startDate, r.endDate, r.billedDays, r.usage, r.units, r.mmbtu]);
      } else if (r.fuel === 'Gas') {
        gasOut.push([jobId, 'Gas', r.startDate, r.endDate, r.billedDays, r.usage, r.units, r.mmbtu]);
      }
    });
  });

  // Open template ZIP and patch sheets; strip all Excel tables to avoid repair errors
  const zip = await JSZip.loadAsync(tplBuf);

  // A sheet's Excel tables are whatever its own .rels points at — the table<N>.xml
  // numbering does NOT track the sheet numbering (in this template table1 belongs to
  // sheet3 and table2 to sheet4, and sheets 1-2 have no table at all). Deleting them
  // by guessed name left sheet3/sheet4 referencing missing parts, which is what makes
  // Excel offer to repair the file.
  async function patchSheet(sheetPath, dataRows, numCols) {
    const sXml = await zip.file(sheetPath).async('string');
    // Write data and remove <tableParts> reference so the sheet doesn't point to a table
    const patched = patchSheetXml(sXml, dataRows, numCols)
      .replace(/<tableParts\b[\s\S]*?<\/tableParts>/g, '')
      .replace(/<tableParts\b[^>]*\/>/g, '');
    zip.file(sheetPath, patched);

    // Drop every table this sheet actually owns, then its relationship entries
    const sheetName = sheetPath.split('/').pop();
    const relsPath = `xl/worksheets/_rels/${sheetName}.rels`;
    const relsFile = zip.file(relsPath);
    if (!relsFile) return;
    const relsXml = await relsFile.async('string');
    const relRe = /<Relationship\b[^>]*Type="[^"]*\/table"[^>]*\/>/g;
    (relsXml.match(relRe) || []).forEach(rel => {
      const target = (rel.match(/Target="([^"]*)"/) || [])[1];
      if (target) zip.remove('xl/' + target.replace(/^\.\.\//, ''));
    });
    zip.file(relsPath, relsXml.replace(relRe, ''));
  }

  await patchSheet('xl/worksheets/sheet1.xml', mainOut,     5);
  await patchSheet('xl/worksheets/sheet2.xml', measuresOut, 19);
  await patchSheet('xl/worksheets/sheet3.xml', elecOut,     8);
  await patchSheet('xl/worksheets/sheet4.xml', gasOut,      8);

  // Remove table content-type entries from [Content_Types].xml
  const ctFile = zip.file('[Content_Types].xml');
  if (ctFile) {
    const ctXml = await ctFile.async('string');
    zip.file('[Content_Types].xml',
      ctXml.replace(/<Override\b[^>]*\/tables\/[^>]*\/>/g, ''));
  }

  const wbBytes = await zip.generateAsync({ type: 'uint8array', compression: 'DEFLATE' });
  const blob = new Blob([wbBytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

  const dateStr = new Date().toISOString().slice(0, 10);
  const idStr   = jobIds.length === 1 ? jobIds[0] : `${jobIds.length}jobs`;
  const filename = `export_${idStr}_${dateStr}.xlsx`;

  await saveOrDownload(blob, filename);

  const note = errors.length ? ` · ${errors.length} error(s)` : '';
  setBadge('ok', `Exported ${filename}${note}`);
}
// ---------- END XLSX EXPORT ----------
</script>
