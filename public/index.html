// Uses JSZip to patch the template ZIP directly, avoiding SheetJS's table round-trip
// limitation (SheetJS CE drops xl/tables/*.xml files on write).

function colIdxToLetter(idx) {
  if (idx < 26) return String.fromCharCode(65 + idx);
  return String.fromCharCode(64 + Math.floor(idx / 26)) + String.fromCharCode(65 + (idx % 26));
}

function buildRowXml(rowNum, values) {
  let xml = `<row r="${rowNum}" spans="1:${values.length}">`;
  values.forEach((val, i) => {
    if (val == null || val === '') return;
    const ref = colIdxToLetter(i) + rowNum;
    if (typeof val === 'number') {
      xml += `<c r="${ref}"><v>${val}</v></c>`;
    } else {
      xml += `<c r="${ref}" t="inlineStr"><is><t>${esc(val)}</t></is></c>`;
    }
  });
  return xml + '</row>';
}

// Keeps template header row (row 1) as-is; replaces all data rows with new ones.
function patchSheetXml(sheetXml, dataRows, numCols) {
  const headerMatch = sheetXml.match(/<row r="1"[\s\S]*?<\/row>/);
  const headerRow = headerMatch ? headerMatch[0] : '';
  const dataXml = dataRows.map((vals, i) => buildRowXml(i + 2, vals)).join('');
  const newSheetData = `<sheetData>${headerRow}${dataXml}</sheetData>`;
  const lastRow = dataRows.length + 1;
  const lastCol = colIdxToLetter(numCols - 1);
  return sheetXml
    .replace(/<sheetData>[\s\S]*?<\/sheetData>/, newSheetData)
    .replace(/(<dimension ref=")[^"]*(")/,  `$1A1:${lastCol}${lastRow}$2`);
}

// Parse the shared string table from xl/sharedStrings.xml into an index array.
function parseSharedStrings(ssXml) {
  const strings = [];
  const siRe = /<si>([\s\S]*?)<\/si>/g;
  let sm;
  while ((sm = siRe.exec(ssXml)) !== null) {
    const parts = [];
    const tRe = /<t[^>]*>([^<]*)<\/t>/g;
    let tm;
    while ((tm = tRe.exec(sm[1])) !== null) parts.push(tm[1]);
    strings.push(parts.join(''));
  }
  return strings;
}

// Extract the text value of each cell in row 1 of a sheet XML.
// Handles both shared strings (t="s") and inline strings (t="inlineStr").
function extractHeaderNames(sheetXml, sharedStrings) {
  const headerMatch = sheetXml.match(/<row r="1"[\s\S]*?<\/row>/);
  if (!headerMatch) return [];
  const names = [];
  const cellRe = /<c r="[A-Z]+1"([^>]*)>([\s\S]*?)<\/c>/g;
  let cm;
  while ((cm = cellRe.exec(headerMatch[0])) !== null) {
    const typeM = cm[1].match(/\bt="([^"]*)"/);
    const cellType = typeM ? typeM[1] : '';
    const inner = cm[2];
    if (cellType === 's') {
      const vM = inner.match(/<v>(\d+)<\/v>/);
      names.push(vM ? (sharedStrings[+vM[1]] || '') : '');
    } else if (cellType === 'inlineStr') {
      const tM = inner.match(/<t[^>]*>([^<]*)<\/t>/);
      names.push(tM ? tM[1] : '');
    } else {
      const vM = inner.match(/<v>([^<]*)<\/v>/);
      names.push(vM ? vM[1] : '');
    }
  }
  return names;
}

// Updates ref + autoFilter ref and rebuilds <tableColumns> to match the actual headers,
// fixing the mismatch that causes Excel to repair/remove the table.
function patchTableXml(tableXml, newRef, columnNames) {
  let out = tableXml
    .replace(/(<table\b[^>]* ref=")[^"]*(")/,       `$1${newRef}$2`)
    .replace(/(<autoFilter\b[^>]* ref=")[^"]*(")/,  `$1${newRef}$2`);
  if (columnNames && columnNames.length) {
    const colsXml = columnNames.map((n, i) =>
      `<tableColumn id="${i + 1}" name="${esc(n || ('Column' + (i + 1)))}"/>`
    ).join('');
    out = out.replace(/<tableColumns[\s\S]*?<\/tableColumns>/,
      `<tableColumns count="${columnNames.length}">${colsXml}</tableColumns>`);
  }
  return out;
}

async function exportXlsx() {
  const rawIds = document.getElementById('jobId').value.trim();
  if (parseJobSearch(rawIds).length === 0) { alert('Enter at least one Job ID or name.'); return; }

  setBadge('loading', 'Resolving jobs…');
  const resolved = await resolveJobIds(rawIds);
  const jobIds = resolved.jobIds;
  if (jobIds.length === 0) { showJobSearchErrors(resolved.errors); return; }
  activeJobIds = jobIds;
  setBadge('loading', 'Building XLSX…');

  let tplBuf;
  try {
    const tplRes = await fetch('/template_range.xlsx');
    if (!tplRes.ok) { alert('template_range.xlsx not found — contact your administrator.'); setBadge('err', 'No template'); return; }
    tplBuf = await tplRes.arrayBuffer();
  } catch(e) { alert('Could not load template.'); setBadge('err', 'Template error'); return; }

  const mainOut = [], measuresOut = [], elecOut = [], gasOut = [];
  const fetched = await fetchJobsAllData(jobIds);
  const jobData = fetched.data;
  const errors = [...resolved.errors, ...fetched.errors];

  jobIds.forEach((jobId, i) => {
    const data = jobData[i];
    if (!data) return;

    // Note: lastData is deliberately NOT reassigned here. The Measures table and its
    // summary panel may be on screen for a different job; repointing the global made
    // the summary describe this job instead on the next re-render.
    const { pct, tier } = getReportingContext(data);

    // Sheet1: AuditId, Path, Savings %, TypeOfHome, HVAC
    const path = tier === 'deep' ? 'Pilot Deep' : tier === 'plus' ? 'Pilot Plus' : '';
    mainOut.push([jobId, path, pct != null ? +pct.toFixed(2) : '', typeOfHomeLabel(data), classifyHvac(data)]);

    // Column order MUST match sheet2's header row (A..S), which is the reporting
    // upload schema in A..J followed by the backing detail in K..S:
    //   A AuditId  B ReportingCode  C Code  D MeasureQty  E Unit
    //   F SavedkWh  G kW  H SavedTherms  I SavedMBTUs  J MeasureCostOverride
    //   K Measure  L Src  M Cost/Unit
    //   N..P Saved kWh/Therms/MMBTU   Q..S Deemed kWh/Therms/MMBTU
    // A..J is what gets reported, so F/H/I carry the tier-basis calculated figures;
    // N..S keep the modeled and deemed breakdown they were derived from. G (kW) has
    // no source in /all-data and is left blank.
    // The sheet layout is fixed by the template, so the Stage and Yearly Energy Cost
    // Savings columns shown in the table and CSV are not carried here.
    flattenMeasures(data).forEach(r => {
      stampCalcColumns(r, tier);
      measuresOut.push([
        jobId, r.measure, r.code, r.quantity, r.unit,
        r.calcKwh, null, r.calcTherms, r.calcMmbtu, r.lineCost,
        r.name, r.source, r.costPerUnit,
        r.savedKwh, r.savedTherms, r.savedMmbtu,
        r.deemedKwh, r.deemedTherms, r.deemedMmbtu
      ]);
    });

    // Column order: table3 = AuditId,Fuel,ElectricBillStartDate,ElectricBillEndDate,Billed Days,ElectricMonthkWhUsage,Units,MMBTU
    // Column order: table4 = AuditId,Fuel,GasBillStartDate,Gas End,GasBilledDays,GasMonthThermsUsage,Units,MMBTU
    flattenUsage(data).forEach(r => {
      if (r.fuel === 'Electric') {
        elecOut.push([jobId, 'Electric', r.startDate, r.endDate, r.billedDays, r.usage, r.units, r.mmbtu]);
      } else if (r.fuel === 'Gas') {
        gasOut.push([jobId, 'Gas', r.startDate, r.endDate, r.billedDays, r.usage, r.units, r.mmbtu]);
      }
    });
  });

  // Open template ZIP and patch sheets; strip all Excel tables to avoid repair errors
  const zip = await JSZip.loadAsync(tplBuf);

  // A sheet's Excel tables are whatever its own .rels points at — the table<N>.xml
  // numbering does NOT track the sheet numbering (in this template table1 belongs to
  // sheet3 and table2 to sheet4, and sheets 1-2 have no table at all). Deleting them
  // by guessed name left sheet3/sheet4 referencing missing parts, which is what makes
  // Excel offer to repair the file.
  async function patchSheet(sheetPath, dataRows, numCols) {
    const sXml = await zip.file(sheetPath).async('string');
    // Write data and remove <tableParts> reference so the sheet doesn't point to a table
    const patched = patchSheetXml(sXml, dataRows, numCols)
      .replace(/<tableParts\b[\s\S]*?<\/tableParts>/g, '')
      .replace(/<tableParts\b[^>]*\/>/g, '');
    zip.file(sheetPath, patched);

    // Drop every table this sheet actually owns, then its relationship entries
    const sheetName = sheetPath.split('/').pop();
    const relsPath = `xl/worksheets/_rels/${sheetName}.rels`;
    const relsFile = zip.file(relsPath);
    if (!relsFile) return;
    const relsXml = await relsFile.async('string');
    const relRe = /<Relationship\b[^>]*Type="[^"]*\/table"[^>]*\/>/g;
    (relsXml.match(relRe) || []).forEach(rel => {
      const target = (rel.match(/Target="([^"]*)"/) || [])[1];
      if (target) zip.remove('xl/' + target.replace(/^\.\.\//, ''));
    });
    zip.file(relsPath, relsXml.replace(relRe, ''));
  }

  await patchSheet('xl/worksheets/sheet1.xml', mainOut,     5);
  await patchSheet('xl/worksheets/sheet2.xml', measuresOut, 19);
  await patchSheet('xl/worksheets/sheet3.xml', elecOut,     8);
  await patchSheet('xl/worksheets/sheet4.xml', gasOut,      8);

  // Remove table content-type entries from [Content_Types].xml
  const ctFile = zip.file('[Content_Types].xml');
  if (ctFile) {
    const ctXml = await ctFile.async('string');
    zip.file('[Content_Types].xml',
      ctXml.replace(/<Override\b[^>]*\/tables\/[^>]*\/>/g, ''));
  }

  const wbBytes = await zip.generateAsync({ type: 'uint8array', compression: 'DEFLATE' });
  const blob = new Blob([wbBytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

  const dateStr = new Date().toISOString().slice(0, 10);
  const idStr   = jobIds.length === 1 ? jobIds[0] : `${jobIds.length}jobs`;
  const filename = `export_${idStr}_${dateStr}.xlsx`;

  await saveOrDownload(blob, filename);

  const note = errors.length ? ` · ${errors.length} error(s)` : '';
  setBadge('ok', `Exported ${filename}${note}`);
}
// The measures export patches a supplied template because its sheet layout is fixed by
// the reporting upload schema. Table 2B has no such template — its shape comes from the
// monthly workbook, which this tool already reads — so it writes a whole workbook
// instead. Inline strings mean no sharedStrings part, and no Excel tables means none of
// the xl/tables/*.xml relationship trouble the template export has to work around.
function buildXlsx(sheets) {
  const zip = new JSZip();
  const XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const REL = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';

  zip.file('_rels/.rels', XML +
    `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
    `<Relationship Id="rId1" Type="${REL}/officeDocument" Target="xl/workbook.xml"/></Relationships>`);

  zip.file('[Content_Types].xml', XML +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    sheets.map((_, i) =>
      `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`
    ).join('') + '</Types>');

  zip.file('xl/workbook.xml', XML +
    `<workbook xmlns="${NS}" xmlns:r="${REL}"><sheets>` +
    sheets.map((s, i) =>
      // Excel rejects a sheet name over 31 characters or containing []:*?/\
      `<sheet name="${esc(String(s.name).replace(/[\[\]:*?\/\\]/g, ' ').slice(0, 31))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`
    ).join('') + '</sheets></workbook>');

  zip.file('xl/_rels/workbook.xml.rels', XML +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    sheets.map((_, i) =>
      `<Relationship Id="rId${i + 1}" Type="${REL}/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`
    ).join('') + '</Relationships>');

  sheets.forEach((sheet, si) => {
    const rows = sheet.rows.map((cells, ri) => {
      const r = ri + 1;
      const xml = cells.map((v, ci) => {
        if (v === null || v === undefined || v === '') return '';
        const ref = colIdxToLetter(ci) + r;
        return (typeof v === 'number' && Number.isFinite(v))
          ? `<c r="${ref}"><v>${v}</v></c>`
          : `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
      }).join('');
      return `<row r="${r}">${xml}</row>`;
    }).join('');
    zip.file(`xl/worksheets/sheet${si + 1}.xml`, XML + `<worksheet xmlns="${NS}"><sheetData>${rows}</sheetData></worksheet>`);
  });

  return zip.generateAsync({ type: 'uint8array', compression: 'DEFLATE' });
}

async function exportTable2BXlsx() {
  if (!t2bResult) { alert('Fetch a job set into the Table 2B view first.'); return; }
  setBadge('loading', 'Building XLSX…');
  const { blocks, comparison, exceptions, unmapped, nonMeasure, variantMisses } = t2bResult;
  const plus = blocks.plus, deep = blocks.deep;
  const dateStr = new Date().toISOString().slice(0, 10);

  // --- sheet 1: the report block ---
  // Flat, one header row, both program blocks on the same line, so a row can be read
  // across or pivoted without unpicking the merged headers of the source workbook.
  const side = (block, label) => {
    const r = block.rows.get(label);
    if (!r) return [0, 0, 0, 0, 0, 0];
    return [r.qty, r.kwh, r.kw, r.therms, r.cost, block.cost ? r.cost / block.cost : 0];
  };
  const grand = block => {
    const t = [...block.rows.values()].reduce((a, r) => ({
      qty: a.qty + r.qty, kwh: a.kwh + r.kwh, kw: a.kw + r.kw, therms: a.therms + r.therms, cost: a.cost + r.cost
    }), { qty: 0, kwh: 0, kw: 0, therms: 0, cost: 0 });
    return [t.qty, t.kwh, t.kw, t.therms, t.cost, block.cost ? 1 : 0];
  };
  const t2bRows = [
    ['ESA Table 2B — Pilot Plus and Pilot Deep'],
    [`Generated ${dateStr} · ${plus.jobs.size + deep.jobs.size} jobs · program ${selectedProgram}` +
      (t2bIncludeNonMeasure ? ' · non-measure costs included' : ' · non-measure costs excluded') +
      (t2bCompletedOnly ? ' · completed jobs only' : ' · all stages')],
    []
  ];

  if (t2bLayout === 'merged') {
    // One set of value columns; the path is a column. A measure on both paths writes two
    // rows, a measure on one writes one, and a measure on neither writes a single zero
    // row so the filing skeleton stays intact.
    t2bRows.push(['Category', 'Measure', 'Unit', 'Path',
      'Quantity Installed', 'kWh (Annual)', 'kW (Annual)', 'Therms (Annual)', 'Expenses ($)', '% of Expenditure']);
    for (const e of mergedT2bRows(plus, deep)) {
      const v = e.row
        ? [e.row.qty, e.row.kwh, e.row.kw, e.row.therms, e.row.cost, e.block.cost ? e.row.cost / e.block.cost : 0]
        : [0, 0, 0, 0, 0, 0];
      t2bRows.push([e.def.category || '', e.def.label, e.def.unit, e.path, ...v]);
    }
    t2bRows.push([]);
    t2bRows.push(['', 'Total Savings/Expenditures', '', 'Pilot Plus', ...grand(plus)]);
    t2bRows.push(['', 'Total Savings/Expenditures', '', 'Pilot Deep', ...grand(deep)]);
    t2bRows.push(['', 'Single Family Households Treated', 'Home', 'Pilot Plus', plus.singleFamily.size]);
    t2bRows.push(['', 'Single Family Households Treated', 'Home', 'Pilot Deep', deep.singleFamily.size]);
    t2bRows.push(['', 'Mobile Homes Treated', 'Home', 'Pilot Plus', plus.mobile.size]);
    t2bRows.push(['', 'Mobile Homes Treated', 'Home', 'Pilot Deep', deep.mobile.size]);
    t2bRows.push(['', 'Total Number of Households Treated', 'Home', 'Pilot Plus', plus.jobs.size]);
    t2bRows.push(['', 'Total Number of Households Treated', 'Home', 'Pilot Deep', deep.jobs.size]);
  } else {
    t2bRows.push(['Category', 'Measure', 'Unit',
      'Plus Quantity', 'Plus kWh', 'Plus kW', 'Plus Therms', 'Plus Expenses ($)', 'Plus % of Expenditure',
      'Deep Quantity', 'Deep kWh', 'Deep kW', 'Deep Therms', 'Deep Expenses ($)', 'Deep % of Expenditure']);
    // Every 2B row is written, installed or not — a zero row is a reported figure.
    for (const def of reference.rows) {
      t2bRows.push([def.category || '', def.label, def.unit, ...side(plus, def.label), ...side(deep, def.label)]);
    }
    t2bRows.push([]);
    t2bRows.push(['', 'Total Savings/Expenditures', '', ...grand(plus), ...grand(deep)]);
    t2bRows.push(['', 'Single Family Households Treated', 'Home', plus.singleFamily.size, '', '', '', '', '', deep.singleFamily.size]);
    t2bRows.push(['', 'Mobile Homes Treated', 'Home', plus.mobile.size, '', '', '', '', '', deep.mobile.size]);
    t2bRows.push(['', 'Total Number of Households Treated', 'Home', plus.jobs.size, '', '', '', '', '', deep.jobs.size]);
  }

  // --- sheet 2: per job, both sides of the comparison ---
  const jobRows = [[
    'AuditId', 'ZIP', 'Climate Zone', 'Zone supported', 'HVAC Type', 'Stage', 'Type of Home',
    'SnuggPro %', 'Zone-corrected %', 'SnuggPro Path', 'Reported Path', 'Path basis', 'Path changed',
    'Reported kWh', 'Reported Therms', 'Delta kWh vs SnuggPro', 'Delta Therms vs SnuggPro', 'Billing months'
  ]];
  comparison.forEach(c => jobRows.push([
    c.jobId, c.zip, c.cz, c.supported ? 'Yes' : 'No', c.hvac, c.stage, c.home,
    c.snuggPct == null ? '' : c.snuggPct, c.recalcPct == null ? '' : c.recalcPct,
    pathLabel(c.snuggPath), pathLabel(c.path), c.basis, c.disagrees ? 'Yes' : 'No',
    c.kwh, c.therms, c.deltaKwh, c.deltaTherms, c.months
  ]));

  // --- sheet 3: everything that needs a human ---
  const excRows = [['Kind', 'AuditId', 'Detail', 'Line items', 'Cost']];
  exceptions.forEach(e => excRows.push([e.kind, e.jobId, e.detail, '', '']));
  (t2bResult.skipped || []).forEach(s => excRows.push(['Filtered out (not completed)', s.jobId, s.stage, '', '']));
  (t2bResult.errors || []).forEach(e => excRows.push(['Job failed to load', '', e, '', '']));
  nonMeasure.forEach(u => excRows.push([
    'Cost with no 2B row' + (t2bIncludeNonMeasure ? ' (included)' : ' (excluded)'),
    '', u.group || u.label, u.n, u.cost]));
  unmapped.forEach(u => excRows.push(['Unmapped line item', '', u.label || '(no name)', u.n, u.cost]));
  (variantMisses || []).forEach(m => excRows.push([
    'No catalog row for the home', '', m.code + ' — ' + m.reason, m.n, '']));

  const bytes = await buildXlsx([
    { name: 'Table 2B', rows: t2bRows },
    { name: 'By Job', rows: jobRows },
    { name: 'Exceptions', rows: excRows }
  ]);
  const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const tag = comparison.length === 1 ? comparison[0].jobId : `${comparison.length}jobs`;
  const filename = `table2b_${tag}_${dateStr}.xlsx`;
  await saveOrDownload(blob, filename);
  setBadge('ok', `Exported ${filename}`);
}
// ---------- END XLSX EXPORT ----------
</script>
</body>
</html>
