// ---------- USAGE / BILLING VIEW ----------
let usageRows = [];

const USAGE_COLS = [
  { key: 'jobId',      label: 'Job',         num: false },
  { key: 'fuel',       label: 'Fuel',        num: false },
  { key: 'startDate',  label: 'Bill Start',  num: false },
  { key: 'endDate',    label: 'Bill End',    num: false },
  { key: 'billedDays', label: 'Billed Days', num: true  },
  { key: 'usage',      label: 'Usage',       num: true  },
  { key: 'units',      label: 'Units',       num: false },
  { key: 'mmbtu',      label: 'MMBTU',       num: true  }
];

// Standard energy-content conversions to MMBTU (1 MMBTU = 1,000,000 BTU).
const KWH_TO_MMBTU = 3412.14 / 1e6; // 1 kWh = 3,412.14 BTU
const THERM_TO_MMBTU = 0.1;         // 1 therm = 100,000 BTU

function daysBetween(a, b) {
  const ms = Date.parse(b) - Date.parse(a);
  return Number.isNaN(ms) ? null : Math.round(ms / 86400000);
}

// Normalize whatever the API returns (ISO date, ISO datetime, or a verbose
// "Mon Jun 23 2026 00:00:00 GMT+0000 (…)" string) to a plain YYYY-MM-DD.
function fmtDate(v) {
  if (!v) return '';
  const s = String(v);
  const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);   // already starts ISO -> slice, no TZ math
  if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;
  const t = Date.parse(s);
  if (Number.isNaN(t)) return s;                      // unparseable -> leave as-is
  const d = new Date(t);
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${m}-${day}`;
}

// Walk the flat, numbered bill series under data.utilities into one row per fuel
// per billing period. Period N spans (prior read date -> end*Date N); usage =
// end*Bill N. Period 1's start is start*Date1; later periods start at the prior
// end date. mmbtu is computed from usage only when units are energy units.
function flattenUsage(data) {
  const u = data && data.utilities;
  if (!u) return [];
  const rows = [];

  function series(fuel, startKey, datePrefix, billPrefix, units, toMmbtu) {
    let prev = u[startKey];
    for (let i = 1; i <= 13; i++) {
      const end = u[datePrefix + i];
      if (!end) break; // series ended
      const usage = num(u[billPrefix + i]);
      const mmbtu = (usage != null && toMmbtu != null) ? +(usage * toMmbtu).toFixed(6) : null;
      rows.push({
        fuel,
        startDate: fmtDate(prev),
        endDate: fmtDate(end),
        billedDays: prev ? daysBetween(prev, end) : null,
        usage,
        units: units || '',
        mmbtu
      });
      prev = end;
    }
  }

  const eUnits = u.electricBillUnits || '';
  series('Electric', 'startElectricDate1', 'endElectricDate', 'endElectricBill',
         eUnits, eUnits === 'kWh' ? KWH_TO_MMBTU : null);

  const fUnits = u.fuelBillUnits || '';
  series('Gas', 'startFuelDate1', 'endFuelDate', 'endFuelBill',
         fUnits, fUnits === 'Therms' ? THERM_TO_MMBTU : null);

  return rows;
}

async function fetchUsageBilling(rawIds) {
  if (parseJobSearch(rawIds).length === 0) { alert('Enter at least one Job ID or name.'); return; }
  setBadge('loading', 'Resolving jobs…');
  const resolved = await resolveJobIds(rawIds);
  const jobIds = resolved.jobIds;
  if (jobIds.length === 0) { showJobSearchErrors(resolved.errors); return; }

  const multi = jobIds.length > 1;
  setBadge('loading', multi ? `Fetching ${jobIds.length} jobs…` : 'Fetching…');
  document.getElementById('resultWrap').style.display = 'block';
  document.getElementById('resultTitle').textContent = 'Usage / Billing';
  showExport2b(false);
  document.getElementById('friendly-view').innerHTML = `<div style="padding:20px;color:#888">Loading ${multi ? jobIds.join(', ') : jobIds[0]}…</div>`;
  document.getElementById('rawPre').textContent = '';
  document.getElementById('endpointDisplay').textContent = multi ? `${jobIds.length} jobs` : `/jobs/${jobIds[0]}/all-data`;
  setView('friendly');

  const fetched = await fetchJobsAllData(jobIds, { refresh: true });
  const jobData = fetched.data;
  const errors = [...resolved.errors, ...fetched.errors];

  const allRows = [];
  let lastUtilities = null;

  jobIds.forEach((jobId, i) => {
    const data = jobData[i];
    if (!data) return;
    if (data.utilities) lastUtilities = data.utilities;
    const rows = flattenUsage(data);
    rows.forEach(r => { r.jobId = jobId; });
    allRows.push(...rows);
  });

  if (allRows.length === 0) {
    setBadge('err', 'No data');
    document.getElementById('friendly-view').innerHTML =
      `<div class="err-block">${errors.map(esc).join('<br/>') || 'No periodic utility bills found for this job (it may use Simple/No-Bills entry).'}</div>`;
    return;
  }

  document.getElementById('rawPre').textContent = JSON.stringify(lastUtilities, null, 2);
  usageRows = allRows;
  activeJobIds = jobIds;
  setBadge('ok', errors.length ? `Loaded · ${errors.length} error(s)` : `${allRows.length} bills`);
  renderUsage();
}

function sortUsage(key) {
  if (sortKey === key) sortDir = -sortDir;
  else { sortKey = key; sortDir = 1; }
  renderUsage();
}

function renderUsage() {
  const rows = [...usageRows];
  if (sortKey) {
    const col = USAGE_COLS.find(c => c.key === sortKey);
    if (col) {
      rows.sort((a, b) => {
        let x = a[sortKey], y = b[sortKey];
        if (col.num) { x = x == null ? -Infinity : x; y = y == null ? -Infinity : y; return (x - y) * sortDir; }
        x = (x || '').toString().toLowerCase(); y = (y || '').toString().toLowerCase();
        return x < y ? -sortDir : x > y ? sortDir : 0;
      });
    }
  }

  // Totals: billedDays + mmbtu only (usage is mixed-unit across fuels).
  const tot = { billedDays: 0, mmbtu: 0 };
  rows.forEach(r => Object.keys(tot).forEach(k => { if (typeof r[k] === 'number') tot[k] += r[k]; }));

  const jobSet = [...new Set(rows.map(r => r.jobId).filter(Boolean))];
  const jobNote = jobSet.length > 1 ? ` · <strong>${jobSet.length}</strong> jobs` : '';
  const elec = rows.filter(r => r.fuel === 'Electric').length;
  const gas = rows.filter(r => r.fuel === 'Gas').length;

  let html = '<div class="measures-toolbar">';
  html += `<span class="summary"><strong>${rows.length}</strong> bills${jobNote} · Electric ${elec} · Gas ${gas} · usage total omitted (mixed units)</span>`;
  html += '<div class="spacer"></div>';
  html += '<button class="csv-btn" onclick="exportUsageCsv()">Download CSV</button>';
  html += '</div>';

  html += '<div class="table-scroll"><table class="measures"><thead><tr>';
  USAGE_COLS.forEach(c => {
    const arrow = sortKey === c.key ? `<span class="arrow">${sortDir === 1 ? '▲' : '▼'}</span>` : '';
    html += `<th onclick="sortUsage('${c.key}')">${c.label}${arrow}</th>`;
  });
  html += '</tr></thead><tbody>';

  rows.forEach(r => {
    html += '<tr>';
    USAGE_COLS.forEach(c => {
      const v = r[c.key];
      if (c.num) {
        let disp = '';
        if (v != null) disp = c.key === 'billedDays' ? String(v) : c.key === 'mmbtu' ? v.toFixed(4) : (Number.isInteger(v) ? String(v) : v.toFixed(2));
        const copyAttr = v == null ? '' : ` data-copy="${v}" onclick="copyCell(this)" title="Click to copy"`;
        html += `<td class="num"${copyAttr}>${disp}</td>`;
      } else {
        const disp = v == null ? '' : esc(v);
        const copyAttr = (v == null || v === '') ? '' : ` data-copy="${esc(v)}" onclick="copyCell(this)"`;
        html += `<td${copyAttr}>${disp}</td>`;
      }
    });
    html += '</tr>';
  });

  html += '<tr style="border-top:2px solid #ddd;font-weight:600;background:#fafafa">';
  USAGE_COLS.forEach(c => {
    if (c.key === 'jobId') { html += '<td>TOTAL</td>'; return; }
    if (c.key === 'billedDays') { html += `<td class="num">${tot.billedDays}</td>`; return; }
    if (c.key === 'mmbtu') { html += `<td class="num">${tot.mmbtu.toFixed(4)}</td>`; return; }
    html += '<td></td>';
  });
  html += '</tr>';

  html += '</tbody></table></div>';
  document.getElementById('friendly-view').innerHTML = html;
}

function exportUsageCsv() {
  const headers = USAGE_COLS.map(c => c.label);
  const lines = [headers.join(',')];
  usageRows.forEach(r => {
    const cells = USAGE_COLS.map(c => {
      let v = r[c.key];
      if (v === null || v === undefined) return '';
      v = String(v);
      if (v.includes(',') || v.includes('"') || v.includes('\n')) v = '"' + v.replace(/"/g, '""') + '"';
      return v;
    });
    lines.push(cells.join(','));
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  saveOrDownload(blob, `usage_${jobFileTag()}.csv`);
}
// ---------- END USAGE / BILLING ----------

// ---------- TABLE 2B (ESA monthly report) ----------
// SnuggPro does not pick deemed savings by climate zone: its per-unit values are the
// CZ10 row of the consolidated measure list for every home, whatever the zone. This
// view re-reads each installed measure against the home's actual zone, re-runs the
// DeemedSavingsCalculator percentage for the jobs SnuggPro puts in the Plus band, and
// rolls the result into the two blocks of ESA Table 2B.
//
// Reference data is generated by tools/build-reference.js from the ESA source
// workbooks. tools/verify-reference.js checks the joins against a real export.

// Energy content, matching DeemedSavingsCalculator-WH_Template cell for cell. Do NOT
// round these to 3412 / 100000 — the sheet's own percentages are computed with these
// constants and this tool is validated against them.
const BTU_PER_KWH = 3412.14;
const BTU_PER_THERM = 100000.013;

// Which zones the measure list publishes measures for lives on the reference object
// (reference.supportedZones), not in a global beside it. It is read from the generated
// data rather than hardcoded, so revising the source workbook cannot leave a stale list
// marking a real zone unsupported — and keeping it on the object means anything that
// swaps the reference in, including the verify harnesses, cannot half-update it.
// A job outside the set is an exception to look at, never a quiet fallback to some
// other zone's savings.

// Table 2B reports "Year-To-Date Completed & Expensed Installation", so the default
// excludes jobs still in audit or bid.
const COMPLETED_STAGE_IDS = new Set([6, 7, 9]);

let reference = null;
let referencePromise = null;
let t2bResult = null;
let t2bHideEmpty = true;
let t2bIncludeNonMeasure = false;
let t2bCompletedOnly = true;
// 'cpuc' reproduces the filing workbook's two side-by-side blocks; 'merged' puts one
// set of value columns beside a Path column.
let t2bLayout = 'cpuc';

// Fetched once per page load. On failure the promise is dropped so the next attempt
// actually retries instead of replaying the rejection forever.
async function loadReference() {
  if (reference) return reference;
  if (!referencePromise) {
    referencePromise = (async () => {
      const names = ['measure-list', 'table2b-rows', 'measure-crosswalk', 'zip-climate-zone'];
      const [measures, rows, crosswalk, zips] = await Promise.all(names.map(async n => {
        const res = await fetch(`/reference/${n}.json`);
        if (!res.ok) throw new Error(`reference/${n}.json — ${res.status} ${res.statusText}`);
        return res.json();
      }));
      reference = {
        byStem: measures.byStem,
        rows: rows.rows,
        byCode: crosswalk.byCode,
        componentSplits: crosswalk.componentSplits || {},
        // Compiled once: these run against every line item of every job.
        nameRules: crosswalk.byName.map(r => ({ re: new RegExp(r.match, 'i'), row: r.row, group: r.group })),
        zones: zips.zones,
        supportedZones: new Set(measures.supportedZones || [])
      };
      if (!reference.supportedZones.size) {
        throw new Error('reference/measure-list.json lists no climate zones - regenerate it');
      }
      t2bShortLabels = null;
      return reference;
    })();
    referencePromise.catch(() => { referencePromise = null; });
  }
  return referencePromise;
}

// normName() and codeStem() MUST stay identical to the versions in
// tools/build-reference.js. The JSON is keyed by their output, so any drift here
// silently stops the join from matching rather than raising anything.
const MOJIBAKE = new RegExp(String.fromCharCode(0xFFFD), 'g');

function normName(t) {
  return String(t == null ? '' : t).trim()
    .replace(MOJIBAKE, '')
    .replace(/&amp;/g, '&')
    .replace(/(\d)\s*1\/2/g, '$1.5')   // fold the fraction before stripping symbols
    .toLowerCase()
    .replace(/[^a-z0-9.]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function codeStem(code) {
  const up = String(code == null ? '' : code).trim().toUpperCase().replace(/\s+/g, '');
  return up.replace(/-CZ\d\d$/, '').replace(/^([A-Z0-9]+?)-\d\d-/, '$1-');
}

// Variant names carry their own zone ("Whole House Fan, CZ16") where the SnuggPro line
// item does not, so drop that suffix before comparing the two.
function variantNameKey(n) {
  return normName(String(n == null ? '' : n).replace(/,\s*CZ\d\d\s*$/i, ''));
}

function stageIdOf(data) {
  const id = data?.job?.stageId ?? data?.stageId;
  return id === null || id === undefined || id === '' ? null : Number(id);
}

function climateZoneFor(data) {
  const zip = String(data?.job?.zip ?? data?.zip ?? '').trim().replace(/\D/g, '').slice(0, 5);
  if (!zip) return { zip: '', cz: null, key: '', supported: false, reason: 'job has no ZIP code' };
  const cz = reference.zones[zip.padStart(5, '0')];
  if (cz == null) return { zip, cz: null, key: '', supported: false, reason: `ZIP ${zip} is not in the climate-zone table` };
  const key = 'CZ' + String(cz).padStart(2, '0');
  const supported = reference.supportedZones.has(cz);
  return { zip, cz, key, supported, reason: supported ? '' : `climate zone ${cz} has no SCE/SCG measures` };
}

// Find the catalog row for this measure in this home's climate zone.
//
// Returns { variant, reason }; a null variant with a reason is a deliberate refusal,
// not a zero. Within one zone the same measure can differ enormously by heating and
// cooling system — attic insulation R-30 at CZ10 is 0.01 kWh for rNCGF and 0.59 for
// rNCEH, 59 times apart — so when every row in the zone names a system and none is
// this home's, picking one would be a fabrication. The line item goes to the exception
// panel instead. A blank HVAC TYPE in the list means the measure does not vary by
// system, and those rows are the correct fallback.
function lookupVariant(entry, czKey, hvac, name) {
  if (!entry || !entry.variants || !entry.variants.length) {
    return { variant: null, reason: 'no catalog entry' };
  }
  const wantHvac = String(hvac || '').toLowerCase();
  const wantName = variantNameKey(name);
  const inZone = v => v.cz === czKey;
  const zoneless = v => !v.cz || v.cz === 'ALL';
  const sameHvac = v => v.hvac && v.hvac.toLowerCase() === wantHvac;
  // Blank means the measure does not vary by system. The literal "HVAC" means the same
  // thing for the tune-up measures (coil cleaning, refrigerant charge) — it names the
  // presence of a system, not a type of one. Reading it as a specific type refused ~100
  // line items across the July job set and dropped their savings.
  const systemAgnostic = v => !v.hvac || v.hvac.toUpperCase() === 'HVAC';
  const sameName = v => variantNameKey(v.name) === wantName;

  const pools = [entry.variants.filter(inZone), entry.variants.filter(zoneless)];
  for (const pool of pools) {
    if (!pool.length) continue;
    const exact = pool.filter(sameHvac);
    const agnostic = pool.filter(systemAgnostic);
    const candidates = exact.length ? exact : agnostic;
    if (!candidates.length) {
      const have = [...new Set(pool.map(v => v.hvac))].join(', ');
      return { variant: null,
        reason: `${czKey || 'zone-independent'} rows are written for ${have}, and this home is ${hvac || 'an unknown system'}` };
    }
    // Several rows can share a code and zone (one lamp / two lamps / three lamps);
    // the line-item name is what tells them apart.
    return { variant: candidates.find(sameName) || candidates[0], reason: '' };
  }
  return { variant: null, reason: czKey ? `no ${czKey} row in the catalog` : 'no zone-independent row in the catalog' };
}

// Where a line item lands in Table 2B. Order: curated code map, then the measure list,
// then the free-text name rules for the line items that carry no code at all.
function resolveRow2b(code, name, fallbackName) {
  const raw = String(code || '').trim();
  const mapped = reference.byCode[raw];
  if (mapped) {
    if (mapped.row) return { row: mapped.row, estimated: mapped.estimated, via: 'code' };
    const target = mapped.stem || mapped.pairsWith;
    const borrowed = target ? reference.byStem[codeStem(target)] : null;
    if (borrowed && borrowed.row2b) {
      return {
        row: borrowed.row2b,
        estimated: mapped.estimated || borrowed.estimated,
        via: mapped.stem ? 'code/stem' : 'code/pair',
        borrowsFrom: mapped.stem ? codeStem(target) : null,
        // pairsWith means the partner half carries the savings for the whole system.
        // Reading them here as well would count the system twice.
        noSavings: !!mapped.pairsWith
      };
    }
  }
  const entry = reference.byStem[codeStem(raw)];
  if (entry) {
    if (entry.row2b) return { row: entry.row2b, estimated: entry.estimated, half: entry.half, via: 'measure-list' };
    // A container measure: the savings sit here, the cost and the 2B row sit on the
    // sibling line items of the same recommendation.
    if (entry.defer) return { row: null, defer: true, via: 'measure-list' };
    if (entry.group) return { row: null, group: entry.group, via: 'measure-list' };
  }
  const text = String(name || '').trim() || String(fallbackName || '');
  for (const rule of reference.nameRules) {
    if (rule.re.test(text)) return { row: rule.row, group: rule.group, via: 'name' };
  }
  return { row: null, via: 'unmapped' };
}

// Split systems arrive as two line items: one carrying the cooling savings, one the
// heating savings, each carrying half the system cost. The heat half sometimes uses a
// different code family (C0-PKG-AC-FAU-* against SWHC049-PKG-AC-FAU-*), so pair on
// system type and tonnage rather than on the code.
function systemHalf(code, name) {
  const src = String(code || '').trim() || String(name || '');
  const half = /\(?\b(COOL|HEAT)\b\)?/i.exec(src);
  if (!half) return null;
  const tons = /(\d+(?:\.\d+)?)\s*(?:T\b|Tons?\b)/i.exec(src);
  if (!tons) return null;
  const up = src.toUpperCase();
  const family =
    (up.includes('PKG-AC-FAU') || up.includes('PACKAGED AC')) ? 'PKG-AC-FAU'
    : (up.includes('SAC-FAU') || up.includes('SPLIT AC AND GAS FAU')) ? 'SAC-FAU'
    : (up.includes('SHP') || up.includes('SPLIT HEAT PUMP')) ? 'SHP'
    : (up.includes('PHP') || up.includes('PACKAGED HEAT PUMP')) ? 'PHP'
    : 'OTHER';
  return { family, tons: tons[1], half: half[1].toUpperCase() };
}

// Twelve rolling months per fuel, converted to BTU — the denominator of the
// DeemedSavingsCalculator percentage. flattenUsage() returns periods in series order,
// so the last twelve are the most recent twelve.
function usageTotals(data) {
  const rows = flattenUsage(data);
  const take = (fuel, units) => rows.filter(r => r.fuel === fuel && r.units === units).slice(-12);
  const elec = take('Electric', 'kWh');
  const gas = take('Gas', 'Therms');
  const kwh = elec.reduce((a, r) => a + (r.usage || 0), 0);
  const therms = gas.reduce((a, r) => a + (r.usage || 0), 0);
  return {
    kwh, therms,
    btu: kwh * BTU_PER_KWH + therms * BTU_PER_THERM,
    elecMonths: elec.length, gasMonths: gas.length
  };
}

// Deemed BTU saved over annual BTU used, as a percentage — Sheet1!C23 of the calculator.
function recalcSavingsPct(items, usage) {
  if (!usage.btu) return null;
  let saved = 0;
  for (const i of items) saved += (i.czKwh || 0) * BTU_PER_KWH + (i.czTh || 0) * BTU_PER_THERM;
  return (saved / usage.btu) * 100;
}

function savingsBand(pct) {
  if (pct == null) return 'review';
  if (pct > 15) return 'deep';
  return pct >= 5 ? 'plus' : 'review';
}

// SnuggPro's percentage decides which block a job is reported in, always. The
// recalculated figure corrects the Plus savings VALUES but does not move the job.
//
// They are not the same quantity: SnuggPro's combinedTotalEnergySavings is modeled plus
// deemed, while the DeemedSavingsCalculator measures deemed alone. On the July 2026 set
// a job SnuggPro puts at 13.9% is 3.3% deemed-only, and banding on the deemed figure
// demoted 11 of 34 Plus households out of the report. Every job in the filed summary
// sits in SnuggPro's own band, so that is what the block assignment follows.
function resolvePath(snuggPct, recalcPct) {
  const snugg = savingsBand(snuggPct);
  if (snugg !== 'plus') return { path: snugg, basis: 'SnuggPro', disagrees: false, snugg, uncorrected: false };
  if (recalcPct == null) {
    return { path: 'plus', basis: 'SnuggPro (not corrected)', disagrees: false, snugg, uncorrected: true };
  }
  // Flagged, not acted on: worth a look when the two figures tell different stories,
  // but the deemed-only percentage is a savings check rather than a band test.
  return {
    path: 'plus', basis: 'SnuggPro band, corrected savings',
    disagrees: savingsBand(recalcPct) !== 'plus', snugg, uncorrected: false
  };
}

const pickNum = (a, b) => (a != null ? a : b);

// A recommendation's modeled savings are a line total that flattenMeasures() copies onto
// every one of its cost lines — summing the rows counts one recommendation several times
// (21% of modeled kWh on the 336-job sample). Count it once, then split it across those
// lines in proportion to cost so it reaches the right 2B rows.
function foldRecommendations(items) {
  const groups = new Map();
  items.forEach(i => {
    if (i.source !== 'rec') return;
    // Group on the recommendation's own identity. Grouping on the title merged two
    // separate recommendations that happened to share one — and a home really can
    // carry two of the same measure.
    const key = i.recId || i.measure;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(i);
  });
  for (const rows of groups.values()) {
    if (rows.length < 2) continue;
    const totalCost = rows.reduce((a, r) => a + (r.lineCost || 0), 0);
    ['savedKwh', 'savedTherms', 'savedMmbtu'].forEach(key => {
      const vals = rows.map(r => r[key]).filter(v => v != null);
      if (vals.length !== rows.length) return;
      // Identical across the group means one line total repeated. Distinct values mean
      // SnuggPro really did vary them per line, so those are left alone.
      if (!vals.every(v => v === vals[0])) return;
      rows.forEach(r => {
        r[key] = totalCost > 0 ? vals[0] * ((r.lineCost || 0) / totalCost) : vals[0] / rows.length;
        r.folded = true;
      });
    });
  }
  return items;
}

// Merge each complete COOL/HEAT pair into the single system Table 2B reports. Quantity
// comes from one half (they always match), cost and savings from both. An orphan half
// still reports its own numbers and is listed as an exception — it means either a half
// nobody entered or a whole system billed on one line, and only the job can say which.
function mergeSystemHalves(items) {
  const out = [];
  const pairs = new Map();
  for (const i of items) {
    if (!i.pair) { out.push(i); continue; }
    const key = i.pair.family + '::' + i.pair.tons;
    if (!pairs.has(key)) pairs.set(key, {});
    pairs.get(key)[i.pair.half] = i;
  }
  const orphans = [];
  for (const p of pairs.values()) {
    if (!p.COOL || !p.HEAT) {
      const side = p.COOL ? 'COOL' : 'HEAT';
      out.push(p[side]);
      orphans.push({ side, item: p[side] });
      continue;
    }
    const add = key => pickNum(p.COOL[key], 0) + pickNum(p.HEAT[key], 0);
    const anyOf = key => (p.COOL[key] != null || p.HEAT[key] != null) ? add(key) : null;
    // Whichever half names a 2B row is the one that describes the system.
    const base = p.COOL.dest && p.COOL.dest.row ? p.COOL : p.HEAT;
    out.push({
      ...base,
      quantity: p.COOL.quantity,
      lineCost: add('lineCost'),
      savedKwh: anyOf('savedKwh'), savedTherms: anyOf('savedTherms'), savedMmbtu: anyOf('savedMmbtu'),
      czKwh: anyOf('czKwh'), czKw: anyOf('czKw'), czTh: anyOf('czTh'),
      deemedKwh: anyOf('deemedKwh'), deemedTherms: anyOf('deemedTherms'),
      pairedFrom: [p.COOL.name, p.HEAT.name]
    });
  }
  return { items: out, orphans };
}

// One job's line items, each annotated with where it belongs in Table 2B and what its
// savings are once the home's real climate zone is applied.
function buildJobItems(jobId, data, zone, hvac) {
  return flattenMeasures(data).map(r => {
    const dest = resolveRow2b(r.code, r.name, r.measure);
    const entry = reference.byStem[codeStem(dest.borrowsFrom || r.code)];
    // A line item with no catalog entry at all is ordinary — permits, audits and
    // mitigation carry cost and no savings. Only a measure that HAS an entry but no
    // usable row for this home is worth flagging.
    const look = (dest.noSavings || !zone.supported || !entry)
      ? { variant: null, reason: '' }
      : lookupVariant(entry, zone.key, hvac, r.name);
    const variant = look.variant;
    const qty = r.quantity == null ? 1 : r.quantity;

    // Where the measure list also publishes a standalone version of one half of this
    // product, carry that half's per-unit values so the row split has a source.
    const split = (reference.componentSplits || {})[codeStem(dest.borrowsFrom || r.code)];
    let componentSplit = null;
    if (split && variant) {
      const comp = lookupVariant(reference.byStem[split.componentStem], zone.key, hvac, '').variant;
      if (comp) componentSplit = { row: split.componentRow, kwh: comp.kwh, kw: comp.kw, th: comp.th };
    }
    return Object.assign({}, r, {
      jobId,
      dest,
      variant,
      variantMiss: look.reason,
      // Deemed savings for the home's actual zone, per unit times quantity.
      czKwh: variant && variant.kwh != null ? variant.kwh * qty : null,
      czKw: variant && variant.kw != null ? variant.kw * qty : null,
      czTh: variant && variant.th != null ? variant.th * qty : null,
      componentSplit,
      pair: systemHalf(r.code, r.name)
    });
  });
}

// One SnuggPro line item can be two Table 2B rows. "Thermostatic Shower Valve and
// 1.25 GPM Showerhead" is sold and deemed as one product (SWWH003) but the report has
// a row for each half, which is why the filed Deep block shows 403 valves and 407
// showerheads — the same install counted on both.
//
// The split is taken from the catalog rather than invented: the standalone showerhead
// measure (SWWH002) is itself in the measure list, so the showerhead row gets its
// published value and the valve row gets what is left over. That is 12.3 of 14 kWh at
// CZ10, and holds at 87.9% in every zone. Quantity appears on both rows, matching the
// filed convention; cost follows the same share. Totals are unchanged either way.
function splitContributions(item, totals, row) {
  const c = item.componentSplit;
  const q = totals.qty || 0;
  if (!c || !q) return [{ row, ...totals }];

  const compKwh = (c.kwh || 0) * q;
  const compTherms = (c.th || 0) * q;
  const compKw = totals.kw ? (c.kw || 0) * q : 0;

  // Share the cost the way the energy splits, so neither row is arbitrary.
  const btu = v => v.kwh * BTU_PER_KWH + v.therms * BTU_PER_THERM;
  const whole = btu(totals);
  const share = whole ? Math.min(1, Math.max(0, btu({ kwh: compKwh, therms: compTherms }) / whole)) : 0.5;

  return [
    { row: c.row, qty: q, kwh: compKwh, therms: compTherms, kw: compKw, cost: totals.cost * share },
    { row, qty: q,
      kwh: totals.kwh - compKwh, therms: totals.therms - compTherms, kw: totals.kw - compKw,
      cost: totals.cost * (1 - share) }
  ];
}

function newBlock() {
  return { rows: new Map(), cost: 0, jobs: new Set(), singleFamily: new Set(), mobile: new Set() };
}

function blockRow(block, label) {
  if (!block.rows.has(label)) {
    block.rows.set(label, { qty: 0, kwh: 0, kw: 0, therms: 0, cost: 0, estimated: false, jobs: new Set() });
  }
  return block.rows.get(label);
}

function buildTable2B(jobs) {
  const blocks = { plus: newBlock(), deep: newBlock(), review: newBlock() };
  const comparison = [], exceptions = [], unmapped = new Map(), nonMeasure = new Map();
  // Catalog misses are aggregated: one measure that has no row for a common HVAC type
  // would otherwise produce a line per job and bury everything else.
  const variantMisses = new Map();

  for (const { jobId, data } of jobs) {
    const zone = climateZoneFor(data);
    const hvac = classifyHvac(data);
    const usage = usageTotals(data);
    let items = buildJobItems(jobId, data, zone, hvac);

    const snuggPct = metaNum(data, 'combinedTotalEnergySavings');
    const recalc = zone.supported ? recalcSavingsPct(items, usage) : null;
    const decision = resolvePath(snuggPct, recalc);
    const block = blocks[decision.path];

    items = foldRecommendations(items);
    const merged = mergeSystemHalves(items);
    items = merged.items;

    if (!zone.supported) exceptions.push({ jobId, kind: 'Climate zone', detail: zone.reason });
    if (usage.elecMonths < 12 || usage.gasMonths < 12) {
      exceptions.push({ jobId, kind: 'Billing history',
        detail: `${usage.elecMonths} months electric, ${usage.gasMonths} months gas — the recalculated percentage needs 12 of each` });
    }
    if (decision.uncorrected) {
      exceptions.push({ jobId, kind: 'Reported uncorrected',
        detail: `SnuggPro's ${snuggPct == null ? 'figure' : snuggPct.toFixed(1) + '%'} is reported as-is — the climate-zone correction could not be computed, so this job still carries SnuggPro's CZ10 savings` });
    }
    if (decision.path === 'review') {
      exceptions.push({ jobId, kind: 'Below 5%',
        detail: `${snuggPct == null ? 'No savings percentage' : snuggPct.toFixed(1) + '%'} — outside both program paths, so this job is in neither block and its costs are not in either total` });
    }
    if (decision.disagrees) {
      exceptions.push({ jobId, kind: 'Deemed savings below the band',
        detail: `SnuggPro reports ${snuggPct == null ? 'no figure' : snuggPct.toFixed(1) + '%'} combined; deemed-only savings are ${recalc == null ? 'unavailable' : recalc.toFixed(1) + '%'} — still reported as Pilot Plus, but worth a look` });
    }
    merged.orphans.forEach(o => exceptions.push({ jobId, kind: 'Unpaired system half',
      detail: `${o.side} only for ${o.item.pair.family} ${o.item.pair.tons} ton, ${fmtMoney(o.item.lineCost)} — either the other half is missing or the whole system is on this line` }));

    let jobKwh = 0, jobTherms = 0, snuggKwh = 0, snuggTherms = 0;

    for (const item of items) {
      const cost = item.lineCost || 0;
      // Deep reports modeled savings; Plus reports zone-corrected deemed. Either way
      // SnuggPro's own deemed value is the last fallback rather than a zero: when the
      // zone is unsupported or the catalog has no row for this home, reporting what
      // SnuggPro reported is no worse than today, and the exception panel says so.
      // Reporting zero would silently understate the measure instead.
      // kW has no source in /all-data at all, so it only ever comes from the measure list.
      const kwh = decision.path === 'deep'
        ? pickNum(item.savedKwh, pickNum(item.czKwh, item.deemedKwh))
        : pickNum(item.czKwh, pickNum(item.deemedKwh, item.savedKwh));
      const therms = decision.path === 'deep'
        ? pickNum(item.savedTherms, pickNum(item.czTh, item.deemedTherms))
        : pickNum(item.czTh, pickNum(item.deemedTherms, item.savedTherms));

      if (item.variantMiss) {
        const key = (item.code || item.name) + ' :: ' + item.variantMiss;
        const acc = variantMisses.get(key) ||
          { code: item.code || item.name, reason: item.variantMiss, n: 0, jobs: new Set() };
        acc.n++; acc.jobs.add(jobId);
        variantMisses.set(key, acc);
      }

      jobKwh += kwh || 0;
      jobTherms += therms || 0;
      snuggKwh += pickNum(item.savedKwh, item.deemedKwh) || 0;
      snuggTherms += pickNum(item.savedTherms, item.deemedTherms) || 0;

      const dest = item.dest || {};
      if (!dest.row) {
        const bucket = dest.group || dest.defer ? nonMeasure : unmapped;
        const key = (dest.group || item.code || item.name || item.measure || 'unknown');
        const acc = bucket.get(key) || { label: item.name || item.measure, group: dest.group, n: 0, cost: 0, jobs: new Set() };
        acc.n++; acc.cost += cost; acc.jobs.add(jobId);
        bucket.set(key, acc);
        // Excluded by default: these are Direct Implementation and mitigation spend, not
        // 2B measure rows. Turning the toggle on files them under Outreach & Assessment
        // so the block total reconciles with the SnuggPro project record.
        if (t2bIncludeNonMeasure && dest.group) {
          const r = blockRow(block, 'ESA WH Outreach & Assessment');
          r.cost += cost; r.jobs.add(jobId);
          block.cost += cost;
        }
        continue;
      }

      // kW exists only in the deemed catalog — SnuggPro carries kWh and therms and
      // nothing else. So a Plus job, whose savings are all deemed, carries kW on every
      // measure that has one; a Deep job carries it only on its direct installs, whose
      // savings are deemed even there. A modeled line has no kW to report.
      const reportedModeled = decision.path === 'deep' && (item.savedKwh != null || item.savedTherms != null);
      const kw = reportedModeled ? 0 : (item.czKw || 0);

      const qty = item.quantity == null ? 0 : item.quantity;
      for (const part of splitContributions(item, { qty, kwh: kwh || 0, therms: therms || 0, kw, cost }, dest.row)) {
        const row = blockRow(block, part.row);
        row.qty += part.qty;
        row.cost += part.cost;
        row.kwh += part.kwh;
        row.therms += part.therms;
        row.kw += part.kw;
        row.jobs.add(jobId);
        if (dest.estimated) row.estimated = true;
      }
      block.cost += cost;
    }

    block.jobs.add(jobId);
    const home = typeOfHomeLabel(data);
    (/mobile|manufactured/i.test(home) ? block.mobile : block.singleFamily).add(jobId);

    comparison.push({
      jobId, zip: zone.zip, cz: zone.key || '—', supported: zone.supported, hvac,
      stage: stageLabel(data), home,
      snuggPct, recalcPct: recalc, path: decision.path, snuggPath: decision.snugg,
      basis: decision.basis, disagrees: decision.disagrees,
      kwh: jobKwh, therms: jobTherms,
      deltaKwh: jobKwh - snuggKwh, deltaTherms: jobTherms - snuggTherms,
      months: Math.min(usage.elecMonths, usage.gasMonths)
    });
  }

  return {
    blocks, comparison, exceptions,
    unmapped: [...unmapped.values()],
    nonMeasure: [...nonMeasure.values()],
    variantMisses: [...variantMisses.values()].sort((a, b) => b.n - a.n)
  };
}

function pathLabel(p) {
  return p === 'deep' ? 'Pilot Deep' : p === 'plus' ? 'Pilot Plus' : 'Review';
}

function fmtMoney(v) {
  const n = Number(v) || 0;
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// refresh:true for an explicit Fetch, matching the other views. The toggles pass false
// so flipping a switch re-reads the cache instead of pulling every job again — on a
// 300-job batch that is the difference between instant and a full round of requests.
async function fetchTable2B(rawIds, { refresh = true } = {}) {
  if (parseJobSearch(rawIds).length === 0) { alert('Enter at least one Job ID or name.'); return; }

  document.getElementById('resultWrap').style.display = 'block';
  document.getElementById('resultTitle').textContent = 'Reporting — ESA Table 2B';
  showExport2b(true);
  document.getElementById('rawPre').textContent = '';
  setView('friendly');

  setBadge('loading', 'Loading reference data…');
  try {
    await loadReference();
  } catch (e) {
    setBadge('err', 'Reference data missing');
    document.getElementById('friendly-view').innerHTML =
      `<div class="err-block">Could not load the ESA reference data: ${esc(e.message)}<br/>` +
      `Run <code>node tools/build-reference.js</code> to generate <code>public/reference/</code>.</div>`;
    return;
  }

  setBadge('loading', 'Resolving jobs…');
  const resolved = await resolveJobIds(rawIds);
  const jobIds = resolved.jobIds;
  if (jobIds.length === 0) { showJobSearchErrors(resolved.errors); return; }

  setBadge('loading', `Fetching ${jobIds.length} job${jobIds.length > 1 ? 's' : ''}…`);
  document.getElementById('friendly-view').innerHTML =
    `<div style="padding:20px;color:#888">Loading ${jobIds.length} job${jobIds.length > 1 ? 's' : ''}…</div>`;
  document.getElementById('endpointDisplay').textContent =
    jobIds.length > 1 ? `${jobIds.length} jobs` : `/jobs/${jobIds[0]}/all-data`;

  const fetched = await fetchJobsAllData(jobIds, { refresh });
  const errors = [...resolved.errors, ...fetched.errors];

  const all = [];
  const skipped = [];
  jobIds.forEach((jobId, i) => {
    const data = fetched.data[i];
    if (!data) return;
    const stage = stageIdOf(data);
    if (t2bCompletedOnly && !COMPLETED_STAGE_IDS.has(stage)) {
      skipped.push({ jobId, stage: stageLabel(data) || 'no stage' });
      return;
    }
    all.push({ jobId, data });
  });

  if (all.length === 0) {
    setBadge('err', 'No jobs to report');
    const why = skipped.length
      ? `All ${skipped.length} job(s) were filtered out by "Completed jobs only": ${skipped.map(s => `${esc(s.jobId)} (${esc(s.stage)})`).join(', ')}.`
      : (errors.map(esc).join('<br/>') || 'No data returned. Check the Job IDs and selected program.');
    document.getElementById('friendly-view').innerHTML = `<div class="err-block">${why}</div>`;
    return;
  }

  t2bResult = buildTable2B(all);
  t2bResult.rawIds = rawIds;
  t2bResult.skipped = skipped;
  t2bResult.errors = errors;
  const errNote = errors.length ? ` · ${errors.length} failed` : '';
  setBadge(errors.length ? 'err' : 'ok', `${all.length} job${all.length > 1 ? 's' : ''} reported${errNote}`);
  renderTable2B();
}

// One control, two states: on is the filing layout, off is the single-column one. Two
// buttons that switched each other off were a radio pair wearing toggle clothes.
function toggleT2bLayout() {
  t2bLayout = t2bLayout === 'cpuc' ? 'merged' : 'cpuc';
  renderTable2B();
}

function toggleT2b(key) {
  if (key === 'empty') t2bHideEmpty = !t2bHideEmpty;
  if (key === 'nonMeasure') t2bIncludeNonMeasure = !t2bIncludeNonMeasure;
  if (key === 'completed') t2bCompletedOnly = !t2bCompletedOnly;
  // The last two change which line items and which jobs are in scope, so they need the
  // job payloads again. The cache makes that free.
  if (key === 'empty') { renderTable2B(); return; }
  fetchTable2B(t2bResult ? t2bResult.rawIds : document.getElementById('jobId').value, { refresh: false });
}

// Column labels for the on-screen table. The filing sheet writes "kWh (Annual)" and so
// on, but the qualifier costs more width than it earns when twelve numeric columns have
// to fit — the block header already says these are year-to-date annual figures. The XLSX
// export keeps its own fuller headings.
const T2B_METRICS = [
  { key: 'qty', label: 'Quantity Installed', dp: 2 },
  { key: 'kwh', label: 'kWh', dp: 2 },
  // kW runs to the thousandths, but only as far as it needs to: most rows are a flat 0
  // and padding them to 0.000 reads as a measurement rather than an absence.
  { key: 'kw', label: 'kW', dp: 3, minDp: 0 },
  { key: 'therms', label: 'Therms', dp: 2 },
  { key: 'cost', label: 'Expenses ($)', dp: 2 }
];

function renderTable2B() {
  if (!t2bResult) return;
  const { blocks, comparison, exceptions, unmapped, nonMeasure, variantMisses } = t2bResult;
  const plus = blocks.plus, deep = blocks.deep, review = blocks.review;

  let h = '<div class="measures-toolbar t2b-toolbar">';
  h += `<span class="summary"><strong>${plus.jobs.size}</strong> Pilot Plus · <strong>${deep.jobs.size}</strong> Pilot Deep`;
  if (review.jobs.size) h += ` · <strong>${review.jobs.size}</strong> to review`;
  h += '</span><div class="spacer"></div>';
  // Every filter reads the same way: "Hide X" is on when X is hidden, and all three are
  // on by default. Mixing "Installed Only" with "Include non-measure costs" meant one
  // chip named what it kept and the next named what it dropped.
  const jobsHidden = t2bResult.skipped.length;
  const chip = (on, fn, label, tip) =>
    `<button class="tool-btn${on ? ' active' : ''}" onclick="${fn}" title="${esc(tip)}">${esc(label)}</button>`;
  h += chip(t2bCompletedOnly, "toggleT2b('completed')", 'Hide In-Progress',
    'Leave out jobs that are not finished — anything not at Retrofit Complete, QA or Archived Won. ' +
    'Table 2B reports completed and expensed installations.' +
    (jobsHidden ? ' Hiding ' + jobsHidden + ' job(s) in this set.' : ''));
  h += chip(!t2bIncludeNonMeasure, "toggleT2b('nonMeasure')", 'Hide Non-Measure',
    'Leave out audit, testing, marketing and mitigation spend. On matches what gets reported; ' +
    'off folds that spend into ESA WH Outreach & Assessment so the total matches the SnuggPro project record.');
  h += chip(t2bHideEmpty, "toggleT2b('empty')", 'Hide Empty',
    'Leave out the measure rows with no installations in this job set.');
  h += chip(t2bLayout === 'cpuc', 'toggleT2bLayout()', 'CPUC',
    'On: the filing shape, a column group per program path side by side. ' +
    'Off: one set of value columns with the path in its own column.');
  h += '</div>';

  // --- headline ---
  h += '<div class="combined-summary"><div class="csum-grid">';
  const totals = b => [...b.rows.values()].reduce((a, r) => ({
    kwh: a.kwh + r.kwh, therms: a.therms + r.therms, cost: a.cost + r.cost
  }), { kwh: 0, therms: 0, cost: 0 });
  const pt = totals(plus), dt = totals(deep);
  const card = (label, val, unit) =>
    `<div class="csum-card"><div class="csum-label">${label}</div><div class="csum-val">${val}<span class="csum-unit">${unit}</span></div></div>`;
  if (plus.jobs.size) {
    h += card('Plus kWh', pt.kwh.toFixed(0), 'kWh');
    h += card('Plus Therms', pt.therms.toFixed(0), 'thm');
    h += card('Plus expenses', fmtMoney(pt.cost), '');
  }
  if (deep.jobs.size) {
    h += card('Deep kWh', dt.kwh.toFixed(0), 'kWh');
    h += card('Deep Therms', dt.therms.toFixed(0), 'thm');
    h += card('Deep expenses', fmtMoney(dt.cost), '');
  }
  h += '</div>';
  const changed = comparison.filter(c => c.disagrees).length;
  const treated = [];
  if (plus.jobs.size) treated.push(`Plus ${plus.singleFamily.size} single family / ${plus.mobile.size} mobile`);
  if (deep.jobs.size) treated.push(`Deep ${deep.singleFamily.size} single family / ${deep.mobile.size} mobile`);
  h += `<div class="csum-breakdown">Households treated — ${treated.join(' &nbsp;·&nbsp; ')}`;
  if (changed) h += ` &nbsp;·&nbsp; <strong>${changed}</strong> job${changed > 1 ? 's' : ''} moved path after the climate-zone correction`;
  h += '</div>';
  // Below-5% jobs belong to neither block, so their money would otherwise be absent
  // from the page with nothing on screen to say so.
  if (review.jobs.size) {
    const rt = totals(review);
    h += `<div class="csum-breakdown"><span class="t2b-bad">${review.jobs.size} job${review.jobs.size > 1 ? 's' : ''} below 5%</span>` +
      ` — ${fmtMoney(rt.cost)}, ${rt.kwh.toFixed(0)} kWh and ${rt.therms.toFixed(0)} therms sit in neither block. Listed under Exceptions.</div>`;
  }
  h += '</div>';

  h += renderT2bTable(plus, deep);
  h += renderT2bComparison(comparison);
  h += renderT2bExceptions(exceptions, unmapped, nonMeasure, variantMisses, t2bResult.skipped, t2bResult.errors);

  document.getElementById('friendly-view').innerHTML = h;
  syncT2bHeaderOffset();
}

// The second header row pins below the first, so it needs the first row's height. That
// height depends on the rendered font and wrapping, so it is measured rather than
// assumed -- a wrong offset lets body rows slide into the gap between the two rows.
//
// Measure a cell WITHOUT rowspan. The Measures and Units cells span both header rows, so
// measuring one of those returns the height of the pair and pins the second row roughly
// a row too low, which is exactly the gap it is supposed to close.
function syncT2bHeaderOffset() {
  const table = document.querySelector('#friendly-view table.t2b');
  if (!table) return;
  const cell = table.querySelector('thead tr:first-child th:not([rowspan])');
  const h = cell && cell.getBoundingClientRect().height;
  if (h > 0) table.style.setProperty('--t2b-head-h', h + 'px');
}

// A narrower window re-wraps the group headers and changes that height.
window.addEventListener('resize', syncT2bHeaderOffset);

// One set of value columns with a Path column beside them, rather than the source
// workbook's two side-by-side blocks. A measure installed on both paths becomes two
// rows; a measure installed on one becomes one. Nothing is summed across paths —
// `% of Expenditure` still divides by that path's own total.
function mergedT2bRows(plus, deep) {
  const out = [];
  for (const def of reference.rows) {
    const p = plus.rows.get(def.label), d = deep.rows.get(def.label);
    if (!p && !d) { out.push({ def, path: '', row: null, block: null }); continue; }
    if (p) out.push({ def, path: 'Pilot Plus', row: p, block: plus });
    if (d) out.push({ def, path: 'Pilot Deep', row: d, block: deep });
  }
  return out;
}

// Shorten a measure label for the screen only. Every row carries the same efficiency
// clause ("with 16+ SEER/95%+ AFUE"), so it costs a line of wrapping per row and
// distinguishes nothing. The full label stays in the cell's tooltip, in the export and
// in every lookup key. Verified collision-free across all 127 rows -- if a future row
// list made two labels collapse together, the guard below keeps them apart.
const T2B_LABEL_SHORTENINGS = [
  [/\s+with\s+\d+\+[^-]*?(?=-\s)/i, ' '],
  [/\bMobile Home\b/g, 'MH']
];
let t2bShortLabels = null;

function buildShortLabelMap() {
  const map = new Map(), used = new Map();
  for (const def of reference.rows) {
    let s = def.label;
    T2B_LABEL_SHORTENINGS.forEach(([re, to]) => { s = s.replace(re, to); });
    s = s.replace(/\s{2,}/g, ' ').trim();
    // Two different measures must never read the same on screen.
    if (used.has(s) && used.get(s) !== def.label) s = def.label;
    else used.set(s, def.label);
    map.set(def.label, s);
  }
  return map;
}

function shortMeasureLabel(label) {
  if (!t2bShortLabels) t2bShortLabels = buildShortLabelMap();
  return t2bShortLabels.get(label) || label;
}

// One cell for a measure name: shortened text, full text on hover when they differ.
function measureNameCell(def, flag) {
  const shortName = shortMeasureLabel(def.label);
  const tip = shortName === def.label ? '' : ` title="${esc(def.label)}"`;
  return `<td class="stick-1 measure-cell"${tip}>${esc(shortName)}${flag}</td>`;
}

// Display rounding only -- data-copy keeps the full-precision value, the same split the
// Measures table uses so a copied cell is never the rounded figure.
function t2bCell(v, dp, minDp) {
  const n = Number(v) || 0;
  const txt = n.toLocaleString('en-US', {
    minimumFractionDigits: minDp === undefined ? dp : minDp,
    maximumFractionDigits: dp
  });
  return `<td class="num copyable${n < 0 ? ' neg' : ''}" data-copy="${v}" onclick="copyCell(this)">${txt}</td>`;
}

function blockTotals(block) {
  return [...block.rows.values()].reduce((a, r) => {
    T2B_METRICS.forEach(m => { a[m.key] = (a[m.key] || 0) + r[m.key]; });
    return a;
  }, {});
}

function renderT2bTable(plus, deep) {
  return t2bLayout === 'merged' ? renderT2bMerged(plus, deep) : renderT2bCpuc(plus, deep);
}

// The filing layout: the source workbook's own shape, both program blocks side by side.
// The Measures and Units columns pin, because the Deep block sits far enough right that
// the measure name would otherwise scroll out of view.
function renderT2bCpuc(plus, deep) {
  // A single-path job set only needs its own block. Printing an all-dashes Pilot Plus
  // group beside a Deep job doubles the table width to say nothing. Both appear as soon
  // as the set contains both, which is the normal case for a monthly filing.
  const blocks = [
    { block: plus, name: 'Pilot Plus', cls: 'blk-plus' },
    { block: deep, name: 'Pilot Deep', cls: 'blk-deep' }
  ].filter(b => b.block.jobs.size > 0);
  if (!blocks.length) blocks.push({ block: plus, name: 'Pilot Plus', cls: 'blk-plus' });

  const WIDE = (T2B_METRICS.length + 1) * blocks.length + 2;
  const side = (block, label) => {
    const r = block.rows.get(label);
    if (!r) return T2B_METRICS.map(() => '<td class="num" style="color:#ccc">—</td>').join('') +
      '<td class="num" style="color:#ccc">—</td>';
    const share = block.cost ? r.cost / block.cost : 0;
    return T2B_METRICS.map(m => t2bCell(r[m.key], m.dp, m.minDp)).join('') +
      `<td class="num copyable" data-copy="${share}" onclick="copyCell(this)">${(share * 100).toFixed(3)}%</td>`;
  };

  const group = (cls, name) =>
    `<th class="${cls} blk-head" colspan="${T2B_METRICS.length + 1}">ESA Program — ${name}</th>`;
  const heads = cls => T2B_METRICS.map(m => `<th class="${cls}">${m.label}</th>`).join('') +
    `<th class="${cls}">% of Expenditure</th>`;

  let h = '<div class="table-scroll"><table class="measures t2b"><thead>';
  h += '<tr><th class="stick-1" rowspan="2">Measures</th><th class="stick-2" rowspan="2">Units</th>' +
    blocks.map(b => group(b.cls, b.name)).join('') + '</tr>';
  h += `<tr>${blocks.map(b => heads(b.cls)).join('')}</tr></thead><tbody>`;

  let category = null, shown = 0, hidden = 0;
  for (const def of reference.rows) {
    const present = blocks.some(b => b.block.rows.get(def.label));
    if (!present && t2bHideEmpty) { hidden++; continue; }
    if (def.category !== category) {
      category = def.category;
      // The workbook writes the category in the measure column with "Total" beside it.
      h += `<tr class="t2b-cat"><td class="stick-1">${esc(category || '')}</td>` +
        `<td class="stick-2">Total</td><td colspan="${WIDE - 2}"></td></tr>`;
    }
    const flag = blocks.some(b => { const r = b.block.rows.get(def.label); return r && r.estimated; })
      ? ' <span class="t2b-estimated" title="Estimated mapping: this measure was matched by reading its name, not from a documented crosswalk. Confirm against a filed report before relying on the row.">Estimated</span>' : '';
    h += '<tr>' + measureNameCell(def, flag) +
      `<td class="stick-2">${esc(def.unit)}</td>` + blocks.map(b => side(b.block, def.label)).join('') + '</tr>';
    shown++;
  }

  const grand = block => {
    const t = blockTotals(block);
    return T2B_METRICS.map(m => t2bCell(t[m.key] || 0, m.dp, m.minDp)).join('') +
      `<td class="num">${block.cost ? '100.000%' : '—'}</td>`;
  };
  h += '<tr class="t2b-total"><td class="stick-1">Total Savings/Expenditures</td><td class="stick-2"></td>' +
    blocks.map(b => grand(b.block)).join('') + '</tr>';
  h += '</tbody></table></div>';
  if (hidden) h += `<div class="t2b-note">${shown} of ${reference.rows.length} measure rows shown — ${hidden} with no installations are hidden.</div>`;
  return h;
}

// The working layout: one set of value columns with a Path column beside them. A measure
// installed on both paths becomes two rows. Nothing is summed across paths — the
// percentage still divides by that path's own total.
function renderT2bMerged(plus, deep) {
  const COLS = T2B_METRICS.length + 1;
  const values = (row, block) => {
    if (!row) return T2B_METRICS.map(() => '<td class="num" style="color:#ccc">—</td>').join('') +
      '<td class="num" style="color:#ccc">—</td>';
    const share = block.cost ? row.cost / block.cost : 0;
    return T2B_METRICS.map(m => t2bCell(row[m.key], m.dp, m.minDp)).join('') +
      `<td class="num copyable" data-copy="${share}" onclick="copyCell(this)">${(share * 100).toFixed(3)}%</td>`;
  };
  const pathCell = path => path
    ? `<td class="t2b-path ${path === 'Pilot Plus' ? 'path-plus' : 'path-deep'}">${path}</td>`
    : '<td style="color:#ccc">—</td>';

  let h = '<div class="table-scroll"><table class="measures t2b"><thead><tr>';
  h += '<th class="stick-1">Measures</th><th class="stick-2">Units</th><th>Path</th>' +
    T2B_METRICS.map(m => `<th>${m.label}</th>`).join('') +
    '<th>% of Expenditure</th></tr></thead><tbody>';

  let category = null, shown = 0, hidden = 0;
  for (const entry of mergedT2bRows(plus, deep)) {
    if (!entry.row && t2bHideEmpty) { hidden++; continue; }
    if (entry.def.category !== category) {
      category = entry.def.category;
      h += `<tr class="t2b-cat"><td class="stick-1">${esc(category || '')}</td>` +
        `<td class="stick-2">Total</td><td colspan="${COLS + 1}"></td></tr>`;
    }
    const flag = entry.row && entry.row.estimated
      ? ' <span class="t2b-estimated" title="Estimated mapping: this measure was matched by reading its name, not from a documented crosswalk. Confirm against a filed report before relying on the row.">Estimated</span>' : '';
    h += '<tr>' + measureNameCell(entry.def, flag) +
      `<td class="stick-2">${esc(entry.def.unit)}</td>` +
      pathCell(entry.path) + values(entry.row, entry.block) + '</tr>';
    shown++;
  }

  // One total per path. Summing the two would report a figure the program does not have.
  const totalRow = (block, path) => {
    const t = blockTotals(block);
    return '<tr class="t2b-total"><td class="stick-1">Total Savings/Expenditures</td><td class="stick-2"></td>' +
      pathCell(path) + T2B_METRICS.map(m => t2bCell(t[m.key] || 0, m.dp, m.minDp)).join('') +
      `<td class="num">${block.cost ? '100.000%' : '—'}</td></tr>`;
  };
  h += (plus.jobs.size ? totalRow(plus, 'Pilot Plus') : '') +
    (deep.jobs.size ? totalRow(deep, 'Pilot Deep') : '');
  h += '</tbody></table></div>';
  if (hidden) h += `<div class="t2b-note">${shown} row${shown === 1 ? '' : 's'} shown — ${hidden} measure${hidden === 1 ? '' : 's'} with no installations are hidden.</div>`;
  return h;
}

function renderT2bComparison(rows) {
  const sorted = [...rows].sort((a, b) =>
    (b.disagrees - a.disagrees) || (a.supported - b.supported) || String(a.jobId).localeCompare(String(b.jobId)));
  const pct = v => v == null ? '—' : v.toFixed(1) + '%';
  const delta = v => {
    const n = Number(v) || 0;
    if (Math.abs(n) < 0.005) return '<td class="num" style="color:#ccc">—</td>';
    return `<td class="num${n < 0 ? ' neg' : ''}">${n > 0 ? '+' : ''}${n.toLocaleString('en-US', { maximumFractionDigits: 1 })}</td>`;
  };
  let h = '<div class="t2b-panel"><h3>SnuggPro vs. climate-zone corrected</h3>';
  h += '<div class="table-scroll"><table class="measures"><thead><tr>' +
    ['Job', 'ZIP', 'Zone', 'HVAC', 'Stage', 'SnuggPro %', 'Corrected %', 'SnuggPro path', 'Reported path', 'Δ kWh', 'Δ Therms', 'Bill months']
      .map(l => `<th>${l}</th>`).join('') + '</tr></thead><tbody>';
  for (const r of sorted) {
    const zoneCell = r.supported ? esc(r.cz) : `<span class="t2b-bad">${esc(r.cz)}</span>`;
    h += `<tr><td>${esc(r.jobId)}</td><td>${esc(r.zip || '—')}</td><td>${zoneCell}</td><td>${esc(r.hvac || '—')}</td>` +
      `<td>${esc(r.stage || '—')}</td><td class="num">${pct(r.snuggPct)}</td><td class="num">${pct(r.recalcPct)}</td>` +
      `<td>${pathLabel(r.snuggPath)}</td>` +
      `<td>${r.disagrees ? `<strong>${pathLabel(r.path)}</strong>` : pathLabel(r.path)}</td>` +
      delta(r.deltaKwh) + delta(r.deltaTherms) +
      `<td class="num${r.months < 12 ? ' neg' : ''}">${r.months}</td></tr>`;
  }
  h += '</tbody></table></div></div>';
  return h;
}

function renderT2bExceptions(exceptions, unmapped, nonMeasure, variantMisses, skipped, errors) {
  let h = '<div class="t2b-panel"><h3>Exceptions</h3>';

  if (errors && errors.length) {
    h += '<h4>Jobs that failed to load</h4><ul class="t2b-list">' +
      errors.map(e => `<li>${esc(e)}</li>`).join('') + '</ul>';
  }
  if (skipped && skipped.length) {
    h += `<h4>Filtered out by "Completed jobs only" (${skipped.length})</h4><ul class="t2b-list">` +
      skipped.map(s => `<li>${esc(s.jobId)} — ${esc(s.stage)}</li>`).join('') + '</ul>';
  }
  if (exceptions.length) {
    const byKind = new Map();
    exceptions.forEach(e => {
      if (!byKind.has(e.kind)) byKind.set(e.kind, []);
      byKind.get(e.kind).push(e);
    });
    for (const [kind, list] of byKind) {
      h += `<h4>${esc(kind)} (${list.length})</h4><ul class="t2b-list">` +
        list.map(e => `<li><strong>${esc(e.jobId)}</strong> — ${esc(e.detail)}</li>`).join('') + '</ul>';
    }
  }

  if (variantMisses && variantMisses.length) {
    const lines = variantMisses.reduce((a, m) => a + m.n, 0);
    h += `<h4>Measures with no catalog row for the home (${lines} line items)</h4>`;
    h += '<div class="t2b-note">These carry their cost into Table 2B but no deemed savings. Savings within one climate zone can differ by more than 50x between heating systems, so no row is picked for them.</div>';
    h += '<ul class="t2b-list">' + variantMisses
      .map(m => `<li><strong>${esc(m.code)}</strong> — ${esc(m.reason)} (${m.n} line item${m.n > 1 ? 's' : ''}, ${m.jobs.size} job${m.jobs.size > 1 ? 's' : ''})</li>`)
      .join('') + '</ul>';
  }

  const spend = list => list.reduce((a, u) => a + u.cost, 0);
  if (nonMeasure.length) {
    const total = spend(nonMeasure);
    h += `<h4>Costs with no Table 2B row — ${fmtMoney(total)} across ${nonMeasure.length} kinds</h4>`;
    h += `<div class="t2b-note">${t2bIncludeNonMeasure
      ? 'Currently included, filed under ESA WH Outreach &amp; Assessment.'
      : 'Currently excluded, matching what gets reported. Turn on "Include non-measure costs" to reconcile against the SnuggPro project record.'}</div>`;
    h += '<ul class="t2b-list">' + nonMeasure
      .sort((a, b) => b.cost - a.cost)
      .map(u => `<li>${fmtMoney(u.cost)} — ${esc(u.group || u.label)} (${u.n} line item${u.n > 1 ? 's' : ''}, ${u.jobs.size} job${u.jobs.size > 1 ? 's' : ''})</li>`)
      .join('') + '</ul>';
  }
  if (unmapped.length) {
    h += `<h4>Unmapped line items — ${fmtMoney(spend(unmapped))} across ${unmapped.length} kinds</h4>`;
    h += '<div class="t2b-note">These reached no Table 2B row and no cost group. Add a rule to tools/build-reference.js and regenerate to fold them in.</div>';
    h += '<ul class="t2b-list">' + unmapped
      .sort((a, b) => b.cost - a.cost)
      .map(u => `<li>${fmtMoney(u.cost)} — ${esc(u.label || '(no name)')} (${u.n} line item${u.n > 1 ? 's' : ''})</li>`)
      .join('') + '</ul>';
  }
  if (!errors.length && !skipped.length && !exceptions.length && !nonMeasure.length &&
      !unmapped.length && !(variantMisses && variantMisses.length)) {
    h += '<div class="t2b-note">Nothing to flag.</div>';
  }
  return h + '</div>';
}

function renderFriendly(data) {
  const el = document.getElementById('friendly-view');
  if (data === null || data === undefined) { el.innerHTML = '<div class="empty-state">Empty response</div>'; return; }
  if (typeof data !== 'object') { el.innerHTML = `<div style="padding:16px;font-family:monospace;font-size:13px;">${data}</div>`; return; }

  const arr = Array.isArray(data) ? data : [data];
  if (arr.length === 0) { el.innerHTML = '<div class="empty-state">No records returned</div>'; return; }

  let html = '';
  const priorityKeys = ['id','job_id','uuid','address','city','state','zip','county','status','stage','name','first_name','last_name','full_name','email','phone','created_at','updated_at','service_time','account_id','company_id','program_id'];

  arr.forEach((item, idx) => {
    if (typeof item !== 'object' || !item) { html += `<div class="field-card" style="margin:4px 0"><div class="field-val">${item}</div></div>`; return; }

    if (arr.length > 1) html += `<div class="section-label">Record ${idx + 1}</div>`;

    const allKeys = Object.keys(item);
    const ordered = [...new Set([...priorityKeys.filter(k => k in item), ...allKeys])];
    const flat = ordered.filter(k => { const v = item[k]; return v === null || v === undefined || typeof v !== 'object'; });
    const nested = ordered.filter(k => { const v = item[k]; return v !== null && v !== undefined && typeof v === 'object'; });

    html += '<div class="field-grid">';
    flat.forEach(k => {
      const v = item[k];
      const display = v === null || v === undefined || v === '' ? '—' : String(v);
      const nullClass = (v === null || v === undefined || v === '') ? ' null-val' : '';
      html += `<div class="field-card"><div class="field-key">${k}</div><div class="field-val${nullClass}">${display}</div></div>`;
    });
    html += '</div>';

    nested.forEach(k => {
      const sub = item[k];
      html += `<div class="section-label">${k}</div>`;
      if (Array.isArray(sub)) {
        if (sub.length === 0) { html += '<div style="color:#aaa;font-size:12px;margin-bottom:12px">Empty array</div>'; return; }
        sub.forEach((s, i) => {
          if (typeof s !== 'object' || !s) { html += `<div class="array-item"><div class="field-val">${s}</div></div>`; return; }
          html += `<div class="array-item"><div class="array-item-header">Item ${i + 1}</div><div class="field-grid">`;
          Object.keys(s).forEach(sk => {
            const sv = s[sk];
            const display = sv === null || sv === undefined || sv === '' ? '—' : (typeof sv === 'object' ? JSON.stringify(sv) : String(sv));
            const nullClass = (sv === null || sv === undefined || sv === '') ? ' null-val' : '';
            html += `<div class="field-card"><div class="field-key">${sk}</div><div class="field-val${nullClass}">${display}</div></div>`;
          });
          html += '</div></div>';
        });
      } else {
        html += '<div class="field-grid">';
        Object.keys(sub).forEach(sk => {
          const sv = sub[sk];
          const display = sv === null || sv === undefined || sv === '' ? '—' : (typeof sv === 'object' ? JSON.stringify(sv) : String(sv));
          const nullClass = (sv === null || sv === undefined || sv === '') ? ' null-val' : '';
          html += `<div class="field-card"><div class="field-key">${sk}</div><div class="field-val${nullClass}">${display}</div></div>`;
        });
        html += '</div>';
      }
    });

    if (idx < arr.length - 1) html += '<hr class="divider" />';
  });

  el.innerHTML = html;
}
